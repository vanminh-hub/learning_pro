['PostgreSQL · EXPLAIN','Cách đọc query execution plan và đo hiệu năng SQL.','https://www.postgresql.org/docs/current/using-explain.html','Database'],
['Docker · Build Context','Định nghĩa build context, COPY/ADD, remote context và .dockerignore.','https://docs.docker.com/build/concepts/context/','DevOps'],
['Docker · Multi-stage build','Cách tách build environment khỏi runtime image.','https://docs.docker.com/build/building/multi-stage/','DevOps'],
['Apache Kafka Documentation','Topics, partitions, consumers và delivery semantics.','https://kafka.apache.org/documentation/','Distributed'],
['Google SRE Book','Service levels, monitoring, overload và vận hành đáng tin cậy.','https://sre.google/sre-book/table-of-contents/','Reliability'],
['Microsoft Well-Architected Framework','Các quality pillars: reliability, security, cost, performance, operations.','https://learn.microsoft.com/azure/well-architected/','Architecture'],
['OpenAI Agents SDK','Agents, tools, guardrails, tracing và evaluation workflows.','https://developers.openai.com/api/docs/guides/agents/sdk','AI'],
['OWASP LLM Top 10','Các nhóm rủi ro như prompt injection, sensitive information và excessive agency.','https://genai.owasp.org/llm-top-10/','AI Security'],
['Model Context Protocol','Đặc tả và kiến trúc chuẩn kết nối agents với tools và resources.','https://modelcontextprotocol.io/introduction','AI']
];
function resourcesView(){return `<div class="page-heading"><div><div class="eyebrow">SOURCE MATERIAL</div><h1>Tài liệu chính thức & mẫu làm việc với AI</h1><p>Tài liệu để đào sâu khi cần. Các link cần Internet; toàn bộ bài học, quiz và tiến độ trong website hoạt động offline.</p></div></div>${section('Bộ prompt mẫu dùng ngay','','<div class="lesson-grid">'+Object.entries({learning:'Gia sư tư duy First Principles',ai_task:'Giao feature cho coding agent',architecture:'Phản biện kiến trúc',incident:'Phân tích sự cố production',pr_review:'Review PR theo quality gates'}).map(([id,label])=>`<div class="card card-pad"><h3>${label}</h3><p class="note">${esc(PROMPTS[id].slice(0,155))}...</p><div class="btn-row"><button class="btn mini soft" data-action="copy-template" data-template="${id}">${I('copy',13)} Copy prompt</button><button class="btn mini outline" data-action="show-template" data-template="${id}">${I('book',13)} Xem đầy đủ</button></div><div id="template-${id}" class="hidden"><pre style="white-space:pre-wrap;font-size:12px;line-height:1.7">${esc(PROMPTS[id])}</pre></div></div>`).join('')+'</div>')}
${section('Tài liệu đáng tin cậy', '',`<div class="lesson-grid">${RESOURCES.map(([name,desc,url,type])=>`<div class="card resource-card"><span class="resource-icon">${I('book')}</span><div><span class="tag neutral">${esc(type)}</span><h3 style="margin-top:6px">${esc(name)}</h3><p>${esc(desc)}</p><a href="${esc(url)}" target="_blank" rel="noopener noreferrer">Mở tài liệu ${I('external',12)}</a></div></div>`).join('')}</div>`)}`;}
function settings(){return `<div class="page-heading"><div><div class="eyebrow">YOUR LEARNING DATA</div><h1>Cài đặt & sao lưu tiến độ</h1><p>Ứng dụng không cần tài khoản và không gửi tiến độ/ghi chú lên server. Dữ liệu được lưu trong trình duyệt hiện tại. Muốn chuyển thiết bị, hãy xuất rồi nhập tệp JSON.</p></div></div><div class="card card-pad"><div class="settings-row"><div><strong>Giao diện tối / sáng</strong><p>Đổi cách hiển thị để học lâu dễ chịu hơn.</p></div><button class="btn outline" data-action="theme">${I(state.theme==='dark'?'sun':'moon')} ${state.theme==='dark'?'Chuyển sáng':'Chuyển tối'}</button></div><div class="settings-row"><div><strong>Sao lưu tiến độ và ghi chú</strong><p>Xuất JSON chứa các quiz, bài hoàn thành, ghi chú lab và nhật ký cá nhân.</p></div><button class="btn" data-action="export">${I('download')} Xuất JSON</button></div><div class="settings-row"><div><strong>Khôi phục tiến độ từ JSON</strong><p>Nhập file đã xuất. Dữ liệu hiện có sẽ được thay bằng bản sao lưu.</p></div><div><input hidden type="file" id="import-file" accept="application/json,.json"/><button class="btn outline" data-action="import">${I('upload')} Nhập JSON</button></div></div><div class="settings-row"><div><strong>Xóa dữ liệu học trên trình duyệt</strong><p class="data-risk">Thao tác không thể hoàn tác nếu bạn chưa xuất file sao lưu.</p></div><button class="btn outline" data-action="reset">${I('refresh')} Xóa tiến độ</button></div></div><div class="card card-pad" style="margin-top:18px"><h3>Đang lưu những gì?</h3><p class="lead" style="font-size:13px">${totalDone()} bài hoàn thành · ${Object.values(state.notes).filter(Boolean).length} ghi chú bài · ${Object.keys(state.weekScores).length} bài kiểm tra tuần · ${state.journal?'Có':'Chưa có'} nhật ký học tập · ${labSelfReportedCount()} lab tự xác nhận · ${caseDoneCount()} tình huống đã trả lời.</p><p class="note">Lưu trữ: ${storageOK?'Trình duyệt đã cho phép localStorage.':'Không thể bảo đảm vì quyền lưu trữ bị hạn chế.'} Website chạy độc lập khi mở file HTML. Để chia sẻ tiến độ giữa nhiều máy cần tự đồng bộ file JSON.</p></div>`;}
function render(){const r=route();const [p,arg]=r.split('/');let content;switch(p){case 'dashboard':content=dashboard();break;case 'roadmap':content=roadmap();break;case 'week':content=weekView(Number(arg));break;case 'lessons':content=catalog();break;case 'lesson':content=lessonView(arg);break;case 'method':content=method();break;case 'practice':content=practice();break;case 'review':content=review();break;case 'clinic':content=clinic();break;case 'checkpoint':content=checkpointView(Number(arg));break;case 'glossary':content=glossaryView();break;case 'resources':content=resourcesView();break;case 'settings':content=settings();break;default:content=dashboard();}
 document.body.classList.toggle('dark',state.theme==='dark');document.getElementById('app').innerHTML=shell(content);
 const search=document.getElementById('top-search');if(search){search.value=filterState.q;}
 document.title=(p==='lesson'&&l(arg)?`${l(arg).title} · `:'')+'EngineerOS · Learning Academy';}
async function copyText(t){try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(t);}else{let el=document.createElement('textarea');el.value=t;el.style.position='fixed';el.style.top='-100px';document.body.appendChild(el);el.select();if(!document.execCommand('copy'))throw Error('copy');el.remove();}toast('Đã sao chép vào clipboard.');}catch(e){toast('Trình duyệt chưa cho phép sao chép. Hãy chọn đoạn văn để copy thủ công.');}}
function updateCatalog(){let t=document.getElementById('lesson-results');if(t)t.innerHTML=lessonTiles(filteredLessons());}
function updateGlossary(){let el=document.getElementById('glossary-results');if(el){const rows=GLOSSARY.filter(x=>(glossaryGroup==='Tất cả'||x[2]===glossaryGroup)&&(`${x[0]} ${x[1]}`.toLowerCase().includes(glossaryQuery.toLowerCase())));el.innerHTML=rows.length?rows.map(x=>`<article class="card glossary-item"><span class="tag neutral" style="float:right">${esc(x[2])}</span><strong>${esc(x[0])}</strong><p>${esc(x[1])}</p></article>`).join(''):'<div class="empty">Không tìm thấy thuật ngữ phù hợp.</div>';}}
function refreshKeepScroll(){const y=window.scrollY;render();window.scrollTo(0,y);}
function handleAction(el){const a=el.dataset.action;const id=el.dataset.id;if(a==='toggle-menu'){document.querySelector('.sidebar').classList.toggle('open');document.querySelector('.overlay').classList.toggle('show');}else if(a==='close-menu'){document.querySelector('.sidebar').classList.remove('open');document.querySelector('.overlay').classList.remove('show');}else if(a==='theme'){state.theme=state.theme==='dark'?'light':'dark';save();refreshKeepScroll();}else if(a==='copy-week-code'){copyText(workshop(Number(el.dataset.value)).snippet);}else if(a==='copy-code'){copyText(l(id).code);}else if(a==='copy-template'){copyText(PROMPTS[el.dataset.template]);}else if(a==='show-template'){const box=document.getElementById('template-'+el.dataset.template);if(box)box.classList.toggle('hidden');}else if(a==='toc'){document.getElementById(el.dataset.anchor)?.scrollIntoView({behavior:'smooth',block:'start'});}else if(a==='quiz'){state.correct[id]=Number(el.dataset.value);save();refreshKeepScroll();}else if(a==='complete'){if(state.correct[id]!==l(id).quiz.correct){toast('Hãy trả lời đúng quiz trước khi đánh dấu hoàn thành.');return;}if(completed(id)){state.done=state.done.filter(x=>x!==id);delete state.reviews[id];}else{state.done.push(id);state.reviews[id]={stage:0,due:Date.now()+86400000};}save();refreshKeepScroll();toast(completed(id)?'Đã hoàn thành bài học!':'Đã bỏ đánh dấu hoàn thành.');}else if(a==='clinic-answer'){state.caseAnswers=state.caseAnswers||{};state.caseAnswers[Number(el.dataset.case)]=Number(el.dataset.value);save();refreshKeepScroll();}else if(a==='review-done'){const v=state.reviews?.[id];if(v&&v.due<=Date.now()){v.stage=Math.min(v.stage+1,4);v.due=Date.now()+reviewDelay[v.stage]*86400000;save();refreshKeepScroll();toast('Đã lên lịch lần ôn tiếp theo.');}}else if(a==='checkpoint-answer'){if(!checkpoint.submitted){checkpoint.answers[Number(el.dataset.q)]=Number(el.dataset.value);refreshKeepScroll();}}else if(a==='checkpoint-submit'){const ls=weekLessons(checkpoint.week);if(ls.every((_,i)=>checkpoint.answers[i]!==undefined)){checkpoint.submitted=true;state.weekScores[checkpoint.week]=ls.reduce((s,x,i)=>s+(checkpoint.answers[i]===x.quiz.correct?1:0),0);save();refreshKeepScroll();}}else if(a==='checkpoint-retry'){checkpoint={week:checkpoint.week,answers:{},submitted:false};refreshKeepScroll();}else if(a==='race'||a==='duplicate'||a==='eval'){sim[a]=el.dataset.value;refreshKeepScroll();}else if(a==='export'){const out={app:'engineeros',version:1,exportedAt:new Date().toISOString(),state};const blob=new Blob([JSON.stringify(out,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);let link=document.createElement('a');link.href=url;link.download='engineeros-learning-backup.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),3000);toast('Đã tạo file sao lưu JSON.');}else if(a==='import'){document.getElementById('import-file')?.click();}else if(a==='reset'){if(window.confirm('Bạn muốn xóa toàn bộ tiến độ, điểm kiểm tra và ghi chú trên trình duyệt này? Hãy xuất file sao lưu trước.')){state=blank();save();render();toast('Đã đặt lại tiến độ trên trình duyệt.');}}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-nav],[data-action]');if(!b)return;if(b.dataset.nav){e.preventDefault();navto(b.dataset.nav);return;}if(b.dataset.action){e.preventDefault();handleAction(b);}});
document.addEventListener('input',e=>{const el=e.target;if(el.id==='filter-keyword'){filterState.q=el.value;updateCatalog();}else if(el.id==='glossary-query'){glossaryQuery=el.value;updateGlossary();}else if(el.id==='top-search'){filterState.q=el.value;/* search only on Enter so current page doesn't change while typing */}else if(el.id==='lesson-note'){state.notes[el.dataset.id]=el.value;save();let label=document.getElementById('save-note-status');if(label)label.textContent='Đã lưu ghi chú trên trình duyệt · '+new Date().toLocaleTimeString('vi-VN');const status=document.querySelector('.lab-proof .tag');if(status){const checked=DEEP.lessons[el.dataset.id].criteria.filter((_,i)=>state.practice?.[el.dataset.id]?.[i]).length;status.textContent=selfLabVerified(el.dataset.id)?'Đã tự xác nhận lab':`${checked}/3 tiêu chí · tự xác nhận`;status.className='tag '+(selfLabVerified(el.dataset.id)?'green':'neutral');}}else if(el.id==='recall-answer'){state.reflection[el.dataset.id]=el.value;save();}else if(el.id==='global-journal'){state.journal=el.value;save();let label=document.getElementById('journal-status');if(label)label.textContent='Đã lưu lúc '+new Date().toLocaleTimeString('vi-VN');}else if(el.id==='pool-instances'||el.id==='pool-size'||el.id==='pool-limit'){sim[el.id==='pool-instances'?'poolInstances':el.id==='pool-size'?'poolSize':'poolLimit']=Number(el.value);refreshKeepScroll();}});
document.addEventListener('change',async e=>{const el=e.target;if(el.dataset.labId){const id=el.dataset.labId,i=Number(el.dataset.labIndex);state.practice[id]=state.practice[id]||{};state.practice[id][i]=el.checked;save();refreshKeepScroll();}else if(el.dataset.workshopWeek){const k=`week-${el.dataset.workshopWeek}-${el.dataset.workshopStep}`;state.checklist[k]=el.checked;save();refreshKeepScroll();}else if(el.id==='filter-week'){filterState.week=el.value;updateCatalog();}else if(el.id==='filter-status'){filterState.status=el.value;updateCatalog();}else if(el.id==='glossary-group'){glossaryGroup=el.value;updateGlossary();}else if(el.id==='import-file'&&el.files?.[0]){try{const data=JSON.parse(await el.files[0].text());if(data.app!=='engineeros'||data.version!==1||!data.state||!Array.isArray(data.state.done))throw new Error('Wrong format');if(!confirm('Nhập tiến độ này sẽ thay thế dữ liệu học hiện tại. Tiếp tục?'))return;const s=data.state;state={...blank(),...s,done:s.done.filter(x=>l(x))};save();render();toast('Đã khôi phục tiến độ từ file JSON.');}catch(err){toast('Không đọc được bản sao lưu hợp lệ.');}}});
document.addEventListener('keydown',e=>{if(e.target?.id==='top-search'&&e.key==='Enter'){e.preventDefault();filterState.week='all';filterState.status='all';navto('lessons');const input=document.getElementById('filter-keyword');input?.focus();}});
window.addEventListener('hashchange',()=>{render();window.scrollTo({top:0,behavior:'instant'});});
if(!location.hash)history.replaceState(null,'','#dashboard');render();
})();

</script>
  
</body>
</html>
