  <script>
window.CURRICULUM = {"weeks": [{"n": 1, "title": "Tư duy học sâu & Programming Fundamentals", "summary": "Bắt đầu từ vấn đề; tư duy first principles, decomposition, abstraction và độ phức tạp."}, {"n": 2, "title": "State, Concurrency & .NET Runtime", "summary": "Hiểu state, invariant, race condition, async/await, threads, GC."}, {"n": 3, "title": "HTTP, SQL & Transactions", "summary": "Theo dấu request, mô hình dữ liệu, SQL execution và isolation."}, {"n": 4, "title": "Distributed Systems & Data Consistency", "summary": "Connection pool, consistency, idempotency, cache và hệ thống nhiều node."}, {"n": 5, "title": "Software Design & Domain Architecture", "summary": "Coupling/cohesion, DDD, module boundaries và lựa chọn pattern."}, {"n": 6, "title": "Integration & Resilience", "summary": "API contracts, Kafka, resiliency và data ownership."}, {"n": 7, "title": "Docker, CI/CD, Testing & Security", "summary": "Đưa phần mềm lên môi trường thật và xây hàng rào chất lượng."}, {"n": 8, "title": "Production Reliability & Observability", "summary": "Đo, gỡ lỗi và cải thiện hệ thống đang chạy."}, {"n": 9, "title": "LLM & AI Agent Fundamentals", "summary": "Hiểu giới hạn LLM, thiết kế context, agent và MCP."}, {"n": 10, "title": "AI Product Engineering & Evals", "summary": "RAG, đánh giá chất lượng, AI-assisted development và bảo mật."}, {"n": 11, "title": "Architecture Decisions & Leadership", "summary": "ADR, trade-off, MVP và giao tiếp kỹ thuật."}, {"n": 12, "title": "Capstone: Thiết kế & dẫn dắt hệ thống", "summary": "Review kiến trúc ComHub, failure drills, roadmap và portfolio."}], "lessons": [{"id": "w01-l1", "week": 1, "title": "Học như kỹ sư: First Principles & Active Recall", "concept": "Phương pháp học", "essence": "Không học bằng cách lặp lại định nghĩa. Đặt câu hỏi: Nó giải quyết vấn đề gì? Vì sao cách cũ chưa đủ? Cơ chế nào khiến nó hoạt động? Khi nào nó thất bại? Nếu bỏ công nghệ này, mình tự giải được không?", "mechanism": "Một vòng học gồm ① phỏng đoán trước khi đọc, ② dựng mô hình bằng lời của mình, ③ làm ví dụ tối giản, ④ cố tình phá ví dụ, ⑤ kiểm tra bằng test/log/đo đạc, ⑥ viết lại từ trí nhớ sau 1, 3, 7 ngày. Đây là active recall + spaced repetition + deliberate practice.", "analogy": "Đọc công thức bơi không giúp bạn bơi. Bạn phải xuống nước, mắc lỗi, nhận phản hồi và sửa động tác.", "scenario": "Khi học Redis: hãy bắt đầu từ câu hỏi “vì sao API đọc database chậm”, sau đó đo trước/sau cache, cố tình làm cache cũ và viết chiến lược invalidation.", "common_mistake": "Sưu tầm hàng trăm tutorial, ghi chép đẹp nhưng không tự giải thích hay tái hiện được lỗi. Đó là ảo giác đã hiểu.", "tradeoff": "Học sâu chậm hơn xem video nhưng tăng khả năng chuyển kiến thức sang bài toán mới. Chỉ đọc lướt khi bạn cần tra cứu nhanh, không dùng nó để thay thế luyện tập.", "code": "// Nhật ký mỗi bài\n// WHY: vấn đề ban đầu?\n// HOW: giải thích bằng cơ chế?\n// BREAK: tình huống nào làm sai?\n// EVIDENCE: test/log/metrics?\n// TRADE-OFF: mất gì để đổi lấy gì?", "practice": "Tạo Learning Journal cho vấn đề PostgreSQL “too many clients”: viết 5 giả thuyết, cách kiểm chứng và ghi lại một giả thuyết đã bị bác bỏ.", "quiz": {"question": "Hoạt động nào là active recall?", "options": ["Đọc lại bài 5 lần", "Đóng tài liệu và tự giải thích bằng trí nhớ", "Đánh dấu highlight mọi câu", "Chỉ xem video tốc độ cao"], "correct": 1, "explain": "Phải chủ động lấy kiến thức từ trí nhớ và tự đối chiếu. Nhận ra chữ khi đọc không tương đương với khả năng áp dụng."}, "reference": ""}, {"id": "w01-l2", "week": 1, "title": "Bản chất lập trình: biến bài toán thành mô hình", "concept": "Problem modeling", "essence": "Lập trình là chuyển yêu cầu mơ hồ thành dữ liệu, quy tắc, trạng thái và thuật toán có thể thực thi. Controller hay framework chỉ là lớp biểu diễn cuối cùng.", "mechanism": "Bắt đầu bằng actors → use cases → entities/value objects → invariants → state transitions → failure cases → acceptance criteria. Viết mô hình và thử phản ví dụ trước khi code.", "analogy": "Bản vẽ công trình không phải ngôi nhà; code cũng không phải bản thân bài toán kinh doanh.", "scenario": "Đặt cơm: một đơn có owner, items, snapshots giá và trạng thái. Quy tắc: tổng tiền = tổng các line snapshot; đơn Paid không được tự chuyển về Draft.", "common_mistake": "Tạo OrderController và database schema ngay sau câu “khách đặt cơm” mà chưa hỏi về đơn trùng, thời hạn sửa đơn hay thanh toán thất bại.", "tradeoff": "Mô hình chi tiết làm rõ hành vi nhưng dễ over-modeling. Đủ để kiểm chứng các điều kiện quan trọng của MVP trước.", "code": "public enum OrderStatus { Draft, Submitted, Paid, Cancelled }\n// Trạng thái không phải chuỗi có thể đổi tùy ý.\n// Cần phương thức chuyển trạng thái kiểm tra điều kiện.", "practice": "Viết ít nhất 7 invariants và 5 failure cases cho module Order; không viết API trước khi xong.", "quiz": {"question": "Điều gì nên định nghĩa trước OrderRepository?", "options": ["Tên bảng SQL", "Business invariants và state transitions", "Dockerfile", "Tên lớp Controller"], "correct": 1, "explain": "Ràng buộc nghiệp vụ quyết định data model và code cần có; framework nên phục vụ mô hình."}, "reference": ""}, {"id": "w01-l3", "week": 1, "title": "Decomposition, Abstraction và ranh giới trách nhiệm", "concept": "Abstraction", "essence": "Decomposition chia bài toán; abstraction giữ chi tiết cần thiết và giấu chi tiết không liên quan. Mục tiêu là giảm tải nhận thức, không phải tăng số lớp/interface.", "mechanism": "Mỗi module cần nêu rõ input/output, trách nhiệm, invariant sở hữu và thứ không nên biết. Thử thay đổi một chính sách nghiệp vụ; nếu phải sửa 8 module, ranh giới đang đáng nghi.", "analogy": "Hộp số ô tô có bàn đạp và cần số: lái xe không cần biết từng bánh răng để vận hành; thợ sửa vẫn phải hiểu bên trong khi xảy ra lỗi.", "scenario": "Module Orders sở hữu Order và OrderLine; Notifications nhận sự kiện order-submitted nhưng không tự truy vấn bảng Order để sửa trạng thái đơn.", "common_mistake": "Tạo interface cho mọi class một cách máy móc; đặt các domain logic quan trọng vào một SharedService chung; module nào cũng gọi module nào.", "tradeoff": "Ít abstraction dễ hiểu lúc đầu nhưng có thể phụ thuộc chặt; nhiều abstraction cho phép thay đổi linh hoạt nhưng thêm indirection. Chỉ thêm khi có mục đích rõ.", "code": "public interface IClock { DateTimeOffset UtcNow { get; } }\n// Có ích khi cần kiểm thử logic hết hạn.\n// Không nên tạo interface chỉ vì một class có 1 method.", "practice": "Vẽ dependency graph cho Orders, Payments, Notifications, Catalog. Viết lý do cho từng đường phụ thuộc; loại bỏ hai cạnh không cần thiết.", "quiz": {"question": "Định nghĩa nào phù hợp với abstraction?", "options": ["Tăng số lượng lớp", "Ẩn chi tiết không liên quan qua hợp đồng hữu ích", "Dùng inheritance ở mọi nơi", "Cấm dùng SQL"], "correct": 1, "explain": "Abstraction hữu ích giúp người dùng hợp đồng không phải quan tâm đến chi tiết bên trong, nhưng không xóa chi phí vận hành."}, "reference": ""}, {"id": "w01-l4", "week": 1, "title": "Data Structures, Algorithm & Big-O trong thực tế", "concept": "Complexity", "essence": "Độ phức tạp mô tả chi phí tăng khi input tăng, không chỉ là tốc độ benchmark hôm nay. Đúng dữ liệu và thao tác quyết định nên dùng List, Dictionary, HashSet hay database index.", "mechanism": "Dùng số phép so sánh/tra cứu để phân tích. Tuyến tính O(n) quét n phần tử; trung bình Dictionary lookup O(1) nhưng còn hashing, collision và memory. Database index giảm số hàng cần tìm nhưng có chi phí ghi.", "analogy": "Tra tên trong danh sách giấy lần lượt khác tra mục lục có cấu trúc; mục lục cũng tốn chỗ và công cập nhật.", "scenario": "Với 100.000 mã đơn, tra OrderCode bằng loop mỗi lần sẽ có chi phí tăng theo số lượng; Dictionary/DB index cho đường truy vấn khác.", "common_mistake": "Thấy Big-O tốt rồi bỏ qua độ lớn dữ liệu thực, cache locality, allocations hoặc query N+1.", "tradeoff": "Tối ưu cấu trúc có thể tăng bộ nhớ; chỉ dùng dữ liệu đo được để chọn giải pháp phù hợp thay vì micro-optimize.", "code": "var ids = orders.Select(x => x.Id).ToHashSet();\n// ids.Contains(orderId): trung bình gần O(1)\n// orders.Any(x => x.Id == orderId): O(n)", "practice": "Dùng BenchmarkDotNet hoặc Stopwatch so sánh Contains trên List và HashSet ở 100, 10k, 100k phần tử; diễn giải chứ không chỉ chụp số.", "quiz": {"question": "Khi nào dùng HashSet thường phù hợp hơn List?", "options": ["Cần giữ thứ tự và cho phép phần tử trùng", "Cần kiểm tra phần tử đã tồn tại nhiều lần", "Chỉ có 2 phần tử", "Muốn serialize JSON đẹp"], "correct": 1, "explain": "HashSet phục vụ kiểm tra thành viên hiệu quả và không lưu phần tử trùng, nhưng có overhead về bộ nhớ."}, "reference": ""}, {"id": "w02-l1", "week": 2, "title": "State, Invariants và State Machine", "concept": "Domain state", "essence": "Một hệ thống là tập trạng thái biến đổi theo sự kiện. Invariant là điều phải đúng trước và sau mỗi thay đổi hợp lệ; bảo vệ invariants quan trọng hơn rải if ở nhiều service.", "mechanism": "Mô hình state machine bằng trạng thái, transition, guard, side effect. Không cho phép trạng thái bất kỳ chuyển tùy ý. Kiểm tra guard tại điểm ghi dữ liệu, không chỉ giao diện.", "analogy": "Đèn giao thông không cho phép chuyển trạng thái tùy tiện; nó tuân theo chuỗi và điều kiện chuyển.", "scenario": "Order Paid không được Cancel nếu đã giao; tiền của OrderLine là snapshot khi đặt chứ không lấy trực tiếp giá hiện tại trong Catalog.", "common_mistake": "Sử dụng enum status rồi cho controller set status trực tiếp từ payload, bỏ qua điều kiện chuyển.", "tradeoff": "State machine rõ ràng tăng code ban đầu nhưng giảm bug của các nhánh nghiệp vụ. Với workflow đơn giản chỉ cần methods có guard.", "code": "public void MarkPaid() {\n  if (Status != OrderStatus.Submitted)\n    throw new InvalidOperationException(\"Invalid transition\");\n  Status = OrderStatus.Paid;\n}", "practice": "Liệt kê transition hợp lệ của Order và viết test cho ít nhất 3 transition không hợp lệ.", "quiz": {"question": "Invariant đúng nhất là gì?", "options": ["Thông tin chỉ cần đúng tại UI", "Điều kiện bắt buộc được giữ qua mọi thao tác hợp lệ", "Một phương thức luôn public", "Mọi trạng thái đều có thể chuyển"], "correct": 1, "explain": "Invariant là quy tắc không thể bị phá bởi bất kỳ đường ghi hợp lệ nào, kể cả API, worker hay background job."}, "reference": ""}, {"id": "w02-l2", "week": 2, "title": "Concurrency, Race Condition và Atomicity", "concept": "Concurrency", "essence": "Concurrency nghĩa là nhiều công việc tiến triển xen kẽ; không nhất thiết chạy song song trên nhiều core. Race condition xảy ra khi kết quả phụ thuộc vào thứ tự thực thi không được kiểm soát.", "mechanism": "Read-check-write tách rời tạo cửa sổ tranh chấp. Bảo vệ tính nguyên tử bằng câu UPDATE có điều kiện, constraint, transaction hay lock phù hợp. Ứng dụng nhiều node không thể dựa hoàn toàn vào lock trong process.", "analogy": "Hai người cùng thấy một ghế trống rồi cùng đặt trước khi quầy vé kịp cập nhật.", "scenario": "Hai đơn cùng thấy tồn kho = 1 rồi cùng tạo; fix bằng UPDATE Inventory SET Qty=Qty-1 WHERE Qty>0 và kiểm tra affected rows trong cùng transaction tạo đơn.", "common_mistake": "Dùng lock C# để chống oversell trên ba container: mỗi process có lock riêng nên vẫn race.", "tradeoff": "Pessimistic locking giảm race nhưng tăng wait/deadlock; optimistic concurrency dễ mở rộng khi conflict hiếm nhưng cần xử lý retry.", "code": "UPDATE inventory SET quantity = quantity - 1\nWHERE product_id = @id AND quantity > 0;\n-- Chỉ tạo đơn nếu affected_rows = 1.", "practice": "Gửi 100 request đặt sản phẩm chỉ còn 1, ghi lại số thành công; cố tình tạo phiên bản lỗi rồi sửa và chạy lại.", "quiz": {"question": "Vì sao lock (obj) trong một API instance chưa đủ?", "options": ["Vì nó tăng CPU", "Vì nhiều instance không chia sẻ cùng lock", "Vì C# không hỗ trợ lock", "Vì SQL luôn serial"], "correct": 1, "explain": "Lock trong process không đồng bộ được các node hoặc ứng dụng khác cùng ghi database."}, "reference": ""}, {"id": "w02-l3", "week": 2, "title": "Async/await, Task, ThreadPool & I/O", "concept": "Async programming", "essence": "Async là cơ chế không giữ thread bận trong thời gian chờ I/O; không đồng nghĩa tạo thêm thread hay tự động chạy song song. Task đại diện cho một thao tác có thể chưa hoàn thành.", "mechanism": "Compiler biến async method thành state machine. Khi await Task chưa hoàn tất, continuation sẽ được lên lịch để chạy tiếp khi operation xong. CPU-bound xử lý khác I/O-bound; Task.Run không giúp query DB chạy nhanh hơn.", "analogy": "Phục vụ bàn: nhân viên không cần đứng nhìn lò nướng 5 phút; có thể nhận đơn khác rồi quay lại khi món xong.", "scenario": "ASP.NET API có 300 request chờ database. Async I/O giúp tiết kiệm blocked threads, nhưng nếu SQL vẫn chậm, latency mỗi request chưa chắc giảm.", "common_mistake": "Gọi .Result/.Wait() trong request hoặc bọc mọi async query trong Task.Run, dẫn tới thread pool starvation.", "tradeoff": "Async hỗ trợ throughput khi nhiều I/O; có overhead và không thay thế việc tối ưu tài nguyên phía DB.", "code": "public async Task<Order?> Load(Guid id, CancellationToken ct)\n  => await db.Orders.FindAsync([id], ct);\n// Không cần: Task.Run(() => db.Orders.Find(...))", "practice": "So sánh 100 request HTTP giả lập chờ 200ms dùng Task.Delay và Thread.Sleep; quan sát throughput và thread count.", "quiz": {"question": "await thường làm gì khi I/O chưa xong?", "options": ["Tạo một OS thread mới", "Nhả thread chờ và đăng ký continuation", "Khóa toàn bộ process", "Thực thi câu lệnh nhanh hơn"], "correct": 1, "explain": "await không block thread cho đến khi Task hoàn tất; continuation chạy sau theo scheduler/context."}, "reference": "https://learn.microsoft.com/dotnet/csharp/asynchronous-programming/task-asynchronous-programming-model"}, {"id": "w02-l4", "week": 2, "title": "CLR, Memory, GC và Resource Lifetime", "concept": "Runtime internals", "essence": ".NET quản lý vùng nhớ managed bằng GC nhưng không tự động giải phóng đúng lúc các resource như connection, stream, socket. Hiểu heap, allocation, reference, GC generations và IDisposable là nền tảng xử lý memory/performance.", "mechanism": "GC tìm các object còn reachable rồi thu hồi object không còn reachable. Finalizer không đảm bảo thời gian đóng tài nguyên. IDisposable/IAsyncDisposable cần được gọi trong scope phù hợp.", "analogy": "GC như đội vệ sinh nhà: dọn rác không còn ai dùng, nhưng không thể thay bạn trả chìa khóa thuê xe ngay lập tức.", "scenario": "Tạo HttpClient mới từng request hoặc quên dispose DbContext/Stream có thể gây resource exhaustion dù memory đã được GC.", "common_mistake": "Đồng nhất memory leak với cứ thấy RAM tăng; gọi GC.Collect() mỗi request; giả định using chỉ dành cho file.", "tradeoff": "Pool/reuse giảm overhead nhưng tăng yêu cầu quản lý lifecycle và state; tối ưu khi metrics chỉ ra nguyên nhân.", "code": "await using var stream = File.OpenRead(path);\n// stream đóng cuối scope; GC không quyết định lúc đóng file.", "practice": "Dùng dotnet-counters quan sát allocation, GC pause và thread pool khi API chịu tải; ghi rõ metrics.", "quiz": {"question": "GC có thay thế IDisposable cho database connection không?", "options": ["Có, GC đóng ngay khi không dùng", "Không, GC không bảo đảm thời điểm release resource", "Có nếu dùng record", "Chỉ trên Linux"], "correct": 1, "explain": "Dispose trả resource có thời hạn rõ ràng; GC xử lý managed memory khi runtime quyết định."}, "reference": ""}, {"id": "w03-l1", "week": 3, "title": "HTTP Request từ client đến database", "concept": "Request lifecycle", "essence": "API không chỉ là Controller. Một request đi qua DNS, TCP/TLS, proxy, routing, middleware, auth, application, database rồi quay ngược về client. Sự chậm trễ và lỗi có thể phát sinh ở bất kỳ chặng nào.", "mechanism": "DNS trả địa chỉ, TCP/TLS thiết lập kênh phù hợp, HTTP gửi request, reverse proxy chuyển tiếp, ASP.NET middleware áp dụng cross-cutting concerns. Correlation/trace ID giúp nối cùng một request qua nhiều service.", "analogy": "Gói hàng đi qua nhiều kho: muốn tìm chỗ kẹt phải biết nó đi qua các chặng nào.", "scenario": "Người dùng thấy 504: reverse proxy có thể hết thời gian chờ upstream dù ứng dụng tiếp tục xử lý. Cần trace, proxy metrics, server log, DB time.", "common_mistake": "Thấy 500 thì kết luận controller lỗi; thêm retry ở frontend mà không nghĩ đến duplicate side effects.", "tradeoff": "Mỗi tầng hỗ trợ một loại kiểm soát riêng; thêm nhiều gateway làm routing/security tập trung nhưng tăng hop và cấu hình.", "code": "// Pseudo flow\nClient -> DNS -> TLS -> ReverseProxy -> Middleware\n       -> Endpoint -> AppService -> SQL -> Response", "practice": "Chụp một HTTP trace và vẽ đường đi của request /orders; với mỗi chặng, ghi một lỗi và metric phù hợp.", "quiz": {"question": "HTTP 504 thường chỉ điều gì?", "options": ["Client sai password", "Gateway/upstream bị timeout", "SQL thiếu bảng", "JSON không hợp lệ"], "correct": 1, "explain": "504 Gateway Timeout báo proxy/gateway không nhận kịp phản hồi upstream, không trực tiếp nói nguyên nhân gốc."}, "reference": ""}, {"id": "w03-l2", "week": 3, "title": "Thiết kế dữ liệu: Entity, Key, Constraints", "concept": "Data modeling", "essence": "RDBMS lưu các quan hệ và áp đặt ràng buộc dữ liệu. Schema tốt thể hiện tính đúng đắn nghiệp vụ, không chỉ làm code EF Core dễ map.", "mechanism": "Chọn primary key, foreign key, unique constraint, not null, check; phân biệt snapshot dữ liệu giao dịch với dữ liệu tham chiếu thay đổi theo thời gian. Thiết kế trước các truy vấn quan trọng và nhu cầu lịch sử.", "analogy": "Constraint giống khóa cửa kho: không dựa vào lời dặn ở quầy để ngăn nhập sai dữ liệu.", "scenario": "OrderLine lưu UnitPriceAtPurchase; giá hiện tại trong MenuItem cập nhật không làm đơn hàng quá khứ đổi giá. Unique(OrderId, ProductId) chỉ đúng nếu nghiệp vụ không cho trùng dòng.", "common_mistake": "Chỉ validate tại API, bỏ DB constraint; xóa cascade mọi quan hệ mà không hiểu hậu quả; dùng string cho mọi loại dữ liệu.", "tradeoff": "Normalize giảm dữ liệu lặp nhưng đôi khi tốn JOIN; snapshot/denormalize có chủ đích để bảo vệ lịch sử và hiệu năng đọc.", "code": "CREATE TABLE order_line (\n id uuid PRIMARY KEY,\n order_id uuid NOT NULL REFERENCES orders(id),\n unit_price numeric(12,2) NOT NULL CHECK (unit_price >= 0)\n);", "practice": "Thiết kế Orders / OrderLines / Products; mô tả vì sao phải lưu snapshot tên món và giá, kèm 3 DB constraints.", "quiz": {"question": "Giá món thay đổi thì đơn đã đặt nên tính theo đâu?", "options": ["Giá hiện tại trong catalog", "Giá snapshot được lưu khi đặt", "Giá lớn nhất từ trước đến nay", "Giá cache ngẫu nhiên"], "correct": 1, "explain": "Snapshot bảo vệ tính lịch sử và khả năng đối soát của giao dịch."}, "reference": ""}, {"id": "w03-l3", "week": 3, "title": "SQL Query Plan, Index và N+1", "concept": "Query optimization", "essence": "Index là cấu trúc hỗ trợ tìm kiếm hiệu quả theo một hoặc nhiều key, nhưng không miễn phí. Query optimizer chọn kế hoạch dựa trên thống kê, cardinality, selectivity và chi phí.", "mechanism": "Dùng EXPLAIN (ANALYZE, BUFFERS) quan sát scan, join, estimated vs actual rows, thời gian và I/O. Index phù hợp với điều kiện lọc/sort phổ biến; composite index chịu ảnh hưởng thứ tự cột.", "analogy": "Chỉ mục thư viện giúp đến đúng kệ thay vì đọc từng cuốn; nhưng quá nhiều chỉ mục khiến cập nhật thư viện chậm hơn.", "scenario": "Query danh sách đơn theo TenantId + CreatedAt; composite index phù hợp có thể giảm scan. Khi EF Core phát nhiều query truy xuất từng OrderLine, đó là N+1.", "common_mistake": "Thấy query chậm là thêm index bất kỳ; dùng Include mọi quan hệ gây dữ liệu dư; đo execution time mà bỏ cache nóng/lạnh.", "tradeoff": "Index tăng tốc đường đọc nhất định nhưng tốn disk, memory và write amplification. Đo theo workload thật.", "code": "EXPLAIN (ANALYZE, BUFFERS)\nSELECT * FROM orders\nWHERE tenant_id = @tenant\nORDER BY created_at DESC LIMIT 20;", "practice": "Tạo 100k orders, chạy EXPLAIN trước/sau index (tenant_id, created_at DESC); ghi thay đổi plan và số buffers.", "quiz": {"question": "Vì sao không index mọi cột?", "options": ["Vì index không thể có nhiều hơn một", "Vì index làm tăng chi phí ghi và lưu trữ", "Vì PostgreSQL không có index", "Vì index làm API không thể cache"], "correct": 1, "explain": "Index phải được duy trì khi ghi; tăng chi phí và đôi khi không giúp các query không sử dụng index."}, "reference": ""}, {"id": "w03-l4", "week": 3, "title": "ACID, Transaction Isolation và Locks", "concept": "Database concurrency", "essence": "ACID là các thuộc tính của transaction: Atomicity, Consistency, Isolation, Durability. Isolation không có nghĩa mọi transaction chạy tuần tự trên mọi mức; hành vi phụ thuộc DB và isolation level.", "mechanism": "Transaction bao bọc những ghi dữ liệu cần thành công/thất bại cùng nhau. PostgreSQL MVCC cho phép các transaction đọc các snapshot khác nhau; các kiểu conflict như non-repeatable read, phantom, serialization failure cần được hiểu.", "analogy": "Hai thủ quỹ sửa cùng sổ thu chi: cần quy định khi nào nhìn thấy thay đổi của người kia.", "scenario": "Tạo Order và trừ tồn kho phải commit cùng transaction nếu trong cùng database; nhưng gửi Kafka message không tự động được rollback với transaction SQL.", "common_mistake": "Giữ transaction mở trong lúc gọi API bên ngoài; đọc trước rồi ghi sau không khóa/condition; gọi tất cả lỗi đồng thời là deadlock.", "tradeoff": "Serializable cho bảo đảm mạnh nhưng tăng khả năng retry/chi phí; Read Committed thường đủ nếu kết hợp atomic conditional updates và constraints.", "code": "BEGIN;\nUPDATE inventory SET qty = qty - 1\nWHERE item_id = @id AND qty > 0;\n-- Kiểm tra affected rows = 1 trước khi INSERT order\nCOMMIT;", "practice": "Mở 2 session PostgreSQL để thử cập nhật cùng một row; quan sát lock wait và so sánh với optimistic version check.", "quiz": {"question": "Atomicity của một transaction nghĩa là gì?", "options": ["Một request chạy trên một CPU", "Các thay đổi trong transaction commit cùng nhau hoặc rollback", "Mọi DB có cùng isolation", "Mỗi query luôn nhanh hơn"], "correct": 1, "explain": "Atomicity đảm bảo tập thay đổi của transaction được áp dụng toàn bộ hoặc không áp dụng."}, "reference": "https://www.postgresql.org/docs/current/transaction-iso.html"}, {"id": "w04-l1", "week": 4, "title": "Connection Pooling và bài toán PostgreSQL 53300", "concept": "Pooling & capacity", "essence": "Connection là tài nguyên hữu hạn: DB cần memory/process/session state để phục vụ. Pool tái sử dụng connection thay vì tạo mới liên tục; pool nằm theo tiến trình/config, nhiều instance có thể tạo nhiều pool.", "mechanism": "Số connection tiềm năng xấp xỉ số instances × số pool/config × max pool size. Khi request giữ connection quá lâu, transaction idle, leak hoặc pool quá lớn, DB có thể chạm giới hạn trước khi CPU bận.", "analogy": "Nhà hàng có 30 bàn. Có thêm 10 nhân viên phục vụ không làm xuất hiện thêm bàn; giữ bàn khi chưa dùng làm người khác phải chờ.", "scenario": "4 API pods, mỗi pod pool tối đa 100 có thể tạo nhu cầu đến 400 session nếu tất cả pool được dùng. Tìm pg_stat_activity và thời gian giữ connection.", "common_mistake": "Chữa 53300 bằng kill tất cả idle liên tục mà không tìm nguyên nhân; tăng max_connections không cân RAM, không xử lý pool.", "tradeoff": "Pool quá nhỏ tạo queue và latency; pool quá lớn tạo tranh chấp DB. Tối ưu theo tải đo được, transaction duration và tài nguyên database.", "code": "SELECT state, count(*)\nFROM pg_stat_activity\nGROUP BY state;\n-- Kiểm tra theo app_name, user, age, wait_event.", "practice": "Ước tính tổng tối đa connection cho 3 instances × 2 pool × 40; vẽ cách giảm giữ connection và theo dõi saturation.", "quiz": {"question": "3 instance mỗi instance pool max 20 thì tối đa theo giả thiết là?", "options": ["20", "60", "3", "Không giới hạn"], "correct": 1, "explain": "Ba pool độc lập với max 20 cho tổng lý thuyết 60; thực tế có thể thêm admin/jobs/pool khác."}, "reference": ""}, {"id": "w04-l2", "week": 4, "title": "Distributed Systems: Consistency, Network & Failure", "concept": "Distributed systems", "essence": "Khi có từ hai process/máy, network có thể chậm, mất gói, timeout, đảo thứ tự; không thể dùng giả định call là tức thì và luôn thành công. Đồng bộ thời gian và dữ liệu phức tạp hơn trong một process.", "mechanism": "Phân biệt availability, latency, consistency, durability. Khi timeout, caller có thể không biết remote đã hoàn thành hay chưa. Cần idempotency, retry có giới hạn, trace IDs và reconciliation.", "analogy": "Gửi tiền qua bưu điện nhưng không nhận xác nhận: không thể biết tiền đã gửi chưa; gửi lại vô điều kiện có thể tạo hai giao dịch.", "scenario": "Payment provider đã xử lý nhưng callback timeout: API nhìn thấy lỗi, customer retry. Nếu không dùng idempotency key thì ghi nhận hai payment attempts.", "common_mistake": "Giả định mạng ổn định hoặc lần gọi nào trả timeout cũng chắc chắn chưa thực hiện; dùng distributed transaction như giải pháp mặc định.", "tradeoff": "Consistency mạnh đơn giản cho người dùng nhưng tăng phụ thuộc và latency; eventual consistency hỗ trợ tách service nhưng cần thiết kế trạng thái chuyển tiếp.", "code": "POST /payments\nIdempotency-Key: order-123-payment-v1\n// Một khóa nghiệp vụ đại diện cùng một yêu cầu logic.", "practice": "Viết 5 tình huống network failure: lost request, lost response, retry, partial outage, duplicate event; cách phát hiện và phục hồi.", "quiz": {"question": "Khi client timeout từ payment API, biết chắc điều gì?", "options": ["Payment chắc chắn thất bại", "Payment có thể đã hoàn tất dù response mất", "Payment chắc chắn thành công", "Cần retry vô hạn"], "correct": 1, "explain": "Timeout chỉ cho biết phía gọi không có kết quả kịp thời; phải kiểm tra trạng thái hoặc retry an toàn."}, "reference": ""}, {"id": "w04-l3", "week": 4, "title": "Idempotency, Retry và Exactly-once illusion", "concept": "Idempotency", "essence": "Idempotent operation cho cùng một tác dụng nghiệp vụ khi thực hiện lặp lại; đây là công cụ chống trùng do retry, duplicate delivery và double-click. Exactly-once toàn hệ thống thường cần nhiều điều kiện và cơ chế hợp tác.", "mechanism": "Gán operation ID/idempotency key, lưu trạng thái xử lý và kết quả trong phạm vi transaction phù hợp, ràng buộc unique. Phải quyết định nếu request cùng key nhưng payload khác thì reject.", "analogy": "Khách đưa một số thứ tự để lấy hàng: nhân viên nhìn số sẽ không cấp hai suất cho một lượt.", "scenario": "POST /orders với key tenant+user+requestId; hai request đồng thời phải dựa vào constraint/atomic coordination chứ không chỉ SELECT trước.", "common_mistake": "Dùng in-memory cache để chống trùng ở nhiều pod; coi GET là idempotent nhưng vẫn ghi thống kê business side effect không kiểm soát.", "tradeoff": "Lưu idempotency records tốn storage và cần TTL/retention; key scope sai có thể gộp nhầm các đơn khác nhau.", "code": "CREATE UNIQUE INDEX uq_order_request\nON orders (tenant_id, request_id);\n-- Khi conflict: trả lại kết quả cũ nếu payload phù hợp.", "practice": "Tạo endpoint giả lập double-click 20 lần; bảo đảm duy nhất 1 order, mọi lần trả cùng orderId và không giảm tồn kho 20 lần.", "quiz": {"question": "Giải pháp an toàn hơn để chống duplicate giữa nhiều pod?", "options": ["HashSet trong controller", "UNIQUE constraint + transactional handling", "Thread.Sleep(100)", "Tắt nút UI"], "correct": 1, "explain": "Constraint chia sẻ ở DB giúp bảo vệ dữ liệu dù request đến từ pod khác hoặc qua retry."}, "reference": ""}, {"id": "w04-l4", "week": 4, "title": "Caching, TTL và Cache Invalidation", "concept": "Cache patterns", "essence": "Cache đổi chi phí truy vấn lấy khả năng có dữ liệu cũ, trượt cache và nhu cầu đồng bộ. Cache là bản sao tối ưu đọc chứ không mặc định là nguồn sự thật.", "mechanism": "Xác định cache key, scope tenant, TTL, chiến lược invalidate, xử lý cache miss, stampede và failure fallback. Cache-aside: đọc cache, miss thì DB, ghi cache; cập nhật DB rồi invalidate theo chính sách.", "analogy": "Bảng giá dán bên ngoài cửa hàng: đọc rất nhanh nhưng phải cập nhật khi giá đổi.", "scenario": "Cache menu theo tenant/store; giá thực tế tạo Order phải lấy hoặc bảo vệ từ nguồn dữ liệu tin cậy tại thời điểm transaction.", "common_mistake": "Đưa trạng thái tồn kho có cập nhật nhanh vào cache 30 phút rồi cho đặt hàng dựa trên đó; quên tenant trong key gây lộ data.", "tradeoff": "TTL ngắn giảm staleness nhưng tăng load DB; TTL dài giảm DB load nhưng dữ liệu cũ lâu. Không phải mọi data đáng cache.", "code": "var key = $\"menu:{tenantId}:{storeId}:v1\";\nvar menu = await cache.GetAsync<Menu>(key, ct)\n          ?? await repository.LoadMenuAsync(storeId, ct);", "practice": "Thiết kế 3 loại cache key và mô tả TTL/invalidation cho menu, quyền truy cập và dashboard thống kê.", "quiz": {"question": "Cache-aside làm gì khi cache miss?", "options": ["Trả 500 luôn", "Đọc nguồn thật rồi có thể cache kết quả", "Ghi dữ liệu giả", "Reset database"], "correct": 1, "explain": "Cache-aside dùng DB/source of truth khi miss rồi đưa dữ liệu phù hợp vào cache."}, "reference": ""}, {"id": "w05-l1", "week": 5, "title": "Coupling, Cohesion & Change Cost", "concept": "Modularity", "essence": "Thiết kế tốt làm thay đổi thường xuyên ở một nơi ít ảnh hưởng các nơi khác. Cohesion là một module tập trung trách nhiệm; coupling đo sự phụ thuộc giữa các module.", "mechanism": "Dùng change scenario: “thêm giảm giá theo nhóm” phải sửa bao nhiêu module? Dependency direction và contract ổn định quan trọng hơn số dự án trong solution. Đo bằng ripple effect và review diff.", "analogy": "Một ngăn kéo chứa đúng dụng cụ liên quan sẽ dễ tìm và sửa hơn hộp tất cả mọi thứ.", "scenario": "Module Orders không được import EF Entity của Payments; giao tiếp qua application contract hoặc event. SharedKernel chứa khái niệm thực sự dùng chung, không là bãi chứa.", "common_mistake": "Tạo Shared.Common cho cả business workflow, rồi mọi module phụ thuộc vào một lớp dịch vụ khổng lồ.", "tradeoff": "Tách nhỏ tăng interface/mapping/coordination; gộp lại dễ thao tác ban đầu nhưng khó thay đổi khi nghiệp vụ phát triển.", "code": "// Không nên\nOrdersService -> PaymentsDbContext\n// Thay vào đó\nOrders -> IPaymentPort / PaymentConfirmed event", "practice": "Vẽ kiến trúc module Systems, Identity, Orders, Evaluation. Dự đoán 4 change scenarios và số module bị ảnh hưởng.", "quiz": {"question": "Module nhiều class nhưng cùng một trách nhiệm có thể có gì?", "options": ["High cohesion", "Low cohesion mặc định", "Không coupling", "Không cần test"], "correct": 0, "explain": "Cohesion phản ánh mức độ liên quan về trách nhiệm, không phải số lượng file."}, "reference": ""}, {"id": "w05-l2", "week": 5, "title": "DDD: Bounded Context, Aggregate & Invariants", "concept": "Domain-driven design", "essence": "Bounded Context đặt ranh giới nơi một thuật ngữ và mô hình nghiệp vụ có ý nghĩa nhất quán. Aggregate bảo vệ tính nhất quán của nhóm entity qua một transaction boundary.", "mechanism": "Dùng event storming nhẹ: actors, commands, events, policies, invariants. Không sao chép toàn bộ schema giữa module. Aggregate root kiểm soát thay đổi trạng thái bên trong aggregate.", "analogy": "“Đơn” trong bán hàng và “đơn” trong giao vận có thể cùng tên nhưng quy tắc và trạng thái khác nhau.", "scenario": "Order aggregate quản lý OrderLines và Total; Payments context quản lý payment intent và settlement riêng, kết nối qua hợp đồng.", "common_mistake": "Thấy DDD là phải tạo vô số lớp Entity/VO/Factory hoặc cố đưa mọi dữ liệu vào một aggregate khổng lồ.", "tradeoff": "Aggregate lớn dễ giữ invariant nội bộ nhưng khóa/tranh chấp cao; aggregate nhỏ linh hoạt hơn nhưng cần eventual consistency giữa aggregate.", "code": "public void AddItem(MenuSnapshot menu, int qty) {\n  if (Status != Draft) throw new DomainException();\n  Lines.Add(new OrderLine(menu.Id, menu.Price, qty));\n  RecalculateTotal();\n}", "practice": "Phân biệt các bounded contexts Catalog, Ordering, Kitchen, Delivery; viết một ubiquitous language riêng cho từng context.", "quiz": {"question": "Bounded Context dùng để làm gì?", "options": ["Chia đều code theo số file", "Giới hạn phạm vi mô hình và ngôn ngữ nghiệp vụ", "Chỉ để chia database server", "Thay thế acceptance criteria"], "correct": 1, "explain": "Bounded Context giữ ý nghĩa domain model nhất quán trong một phạm vi xác định."}, "reference": ""}, {"id": "w05-l3", "week": 5, "title": "Clean Architecture vs Vertical Slice vs Layered", "concept": "Architecture styles", "essence": "Layered chia theo loại kỹ thuật; Clean tập trung dependency direction; Vertical Slice tổ chức theo use case. Đây là các cách giải quyết vấn đề khác nhau, có thể kết hợp thay vì chọn theo phong trào.", "mechanism": "Nêu rõ điểm thay đổi thường xuyên, domain complexity, team structure, dependency tests. Ví dụ Vertical Slice giúp tính năng có handler/validator/query gần nhau, Clean có thể giữ domain độc lập với DB/API.", "analogy": "Sắp nhà kho theo loại dụng cụ khác sắp từng hộp theo công việc cần thực hiện; cả hai có ưu/nhược tùy workflow.", "scenario": "Modular Monolith: module Orders chia features PlaceOrder/CancelOrder, domain Order độc lập; persistence adapters dùng EF Core.", "common_mistake": "Dựng 5 projects cho CRUD nhỏ hoặc ép mọi query read-only đi qua domain aggregate phức tạp.", "tradeoff": "Clean làm rõ hướng phụ thuộc nhưng có thể tăng boilerplate; Vertical Slice dễ đổi use case nhưng cần kiểm soát trùng lặp và cross-cutting.", "code": "Modules/Orders/Features/PlaceOrder/\n  Command.cs\n  Validator.cs\n  Handler.cs\n  Endpoint.cs\nModules/Orders/Domain/Order.cs", "practice": "Dùng cùng một feature thiết kế hai cấu trúc thư mục: Layered và Vertical Slice. Viết bảng so sánh 5 tiêu chí.", "quiz": {"question": "Điểm khác biệt chính của Vertical Slice?", "options": ["Bắt buộc microservices", "Tổ chức code xoay quanh use case/feature", "Không sử dụng database", "Chỉ dành cho UI"], "correct": 1, "explain": "Vertical Slice nhóm các mảnh phục vụ một use case thay vì chỉ nhóm theo loại kỹ thuật."}, "reference": ""}, {"id": "w05-l4", "week": 5, "title": "Design Patterns, SOLID & Anti-overengineering", "concept": "Design heuristics", "essence": "Pattern là tên gọi cho cách xử lý một kiểu vấn đề lặp lại; không phải danh sách bắt buộc. SOLID là heuristics hỗ trợ quản lý dependency và khả năng thay đổi, không phải luật vô điều kiện.", "mechanism": "Đầu tiên chỉ ra change axis, dependency risk, duplicate logic gây lỗi. Áp dụng pattern có thể chứng minh đơn giản hơn, dễ test hơn. Nhìn cả chi phí hiểu code của người mới.", "analogy": "Một chiếc búa rất hữu ích với đinh, nhưng dùng nó để vặn ốc là sai công cụ.", "scenario": "Dùng Strategy cho nhiều chính sách tính phí giao hàng thay đổi độc lập; với hai if đơn giản và không kỳ vọng mở rộng, chưa cần framework plugin.", "common_mistake": "Tạo Factory/AbstractFactory/Adapter cho class không cần thay implementation. Đánh đồng “số lớp nhiều” với kiến trúc tốt.", "tradeoff": "Abstraction sớm có thể giảm chi phí tương lai nhưng hiện tại tăng cognitive load. Ưu tiên giải pháp đơn giản có điểm mở rộng rõ.", "code": "public interface IShippingFeePolicy {\n  decimal Calculate(DeliveryContext ctx);\n}\n// Hữu ích khi nhiều loại fee policy độc lập cần thay.", "practice": "Chọn một Pattern trong ComHub; viết tình huống áp dụng, chi phí, và tiêu chí khi sẽ loại bỏ pattern đó.", "quiz": {"question": "Thời điểm hợp lý để tạo Strategy?", "options": ["Mọi method có if", "Có nhiều thuật toán/chính sách cần hoán đổi hợp lý", "Không có thay đổi nào", "Chỉ vì AI đề xuất"], "correct": 1, "explain": "Strategy hiệu quả khi các biến thể hành vi cần thay thế, mở rộng hay kiểm thử độc lập."}, "reference": ""}, {"id": "w06-l1", "week": 6, "title": "REST API Contracts, Compatibility & Versioning", "concept": "API design", "essence": "API là hợp đồng lâu dài với clients, không phải chỉ đường dẫn Controller. Semantics, error model, pagination, authorization, idempotency và compatibility quan trọng hơn URL đẹp.", "mechanism": "Phân biệt 400/401/403/404/409/422/429 và cách client xử lý; dùng stable identifiers, consistent errors, backward-compatible changes, contract tests.", "analogy": "Hợp đồng giao hàng: bên giao và bên nhận phải đồng ý về định dạng, trạng thái và cách xử lý lỗi.", "scenario": "POST /orders có idempotency key; GET /orders cursor-based pagination; 409 khi conflict state; authorization theo tenant và owner.", "common_mistake": "Đổi tên field bất ngờ phá mobile client, HTTP 200 cho mọi lỗi, GET có side effect tạo giao dịch.", "tradeoff": "Versioning bảo vệ client cũ nhưng tăng chi phí duy trì; ưu tiên compatible evolution trước khi thêm version mới.", "code": "HTTP/1.1 409 Conflict\nContent-Type: application/problem+json\n{ \"type\": \"order-state-conflict\", \"title\": \"Order cannot be cancelled\" }", "practice": "Viết API contract cho PlaceOrder, CancelOrder, GetOrder; nêu errors và cách retry an toàn.", "quiz": {"question": "API 409 phù hợp với tình huống nào?", "options": ["User chưa login", "Conflict trạng thái nghiệp vụ", "Server ngừng điện", "API không tồn tại"], "correct": 1, "explain": "409 phản ánh request xung đột với trạng thái tài nguyên hiện tại."}, "reference": ""}, {"id": "w06-l2", "week": 6, "title": "Kafka/RabbitMQ: Queue, Topic, Delivery Semantics", "concept": "Messaging", "essence": "Messaging tách thời điểm producer phát sinh sự kiện với consumer xử lý. Không phải message broker nào cũng giống nhau: queue, topic, consumer group, partition và ack thay đổi semantics.", "mechanism": "Xem lifecycle send→persist→deliver→process→ack. Consumer có thể nhận lại message nếu crash trước ack; cần idempotency, DLQ/retry policy, ordering theo key nếu cần.", "analogy": "Bưu điện cho phép người gửi để thư và đi làm tiếp; thư có thể đến trễ hoặc phải phát lại.", "scenario": "OrderSubmitted được publish, Kitchen worker nhận và tạo KitchenTicket. Nếu nhận lặp lại thì unique OrderId+TicketType không cho tạo trùng.", "common_mistake": "Cứ thấy Kafka là bảo đảm exactly once end-to-end; giả định thứ tự tuyệt đối giữa mọi partition.", "tradeoff": "Asynchronous messaging tăng resilience và decoupling, nhưng gây eventual consistency, debugging khó và vận hành phức tạp.", "code": "public async Task Handle(OrderSubmitted e) {\n  if (await tickets.Exists(e.OrderId)) return;\n  await tickets.CreateFor(e.OrderId);\n}", "practice": "Vẽ một message flow Kafka với producer, topic, partitions, group, retry và duplicate detection.", "quiz": {"question": "Consumer xử lý message xong nhưng chết trước ack có thể gây gì?", "options": ["Không có gì", "Message được giao lại và cần xử lý trùng", "Topic bị xóa", "Producer tự rollback SQL"], "correct": 1, "explain": "Ở cơ chế at-least-once, thiếu ack có thể làm broker phát lại message."}, "reference": ""}, {"id": "w06-l3", "week": 6, "title": "Timeout, Retry, Circuit Breaker & Backpressure", "concept": "Resilience", "essence": "Gọi network luôn có nguy cơ lỗi tạm thời. Resilience không phải retry mọi lỗi; mục tiêu là hạn chế lỗi lan truyền và kiểm soát tài nguyên.", "mechanism": "Đặt timeout budget xuyên request, retry có exponential backoff + jitter chỉ với lỗi transient/an toàn, circuit breaker khi downstream suy yếu và giới hạn concurrency/queue tránh overload.", "analogy": "Khi quầy đông, cứ xếp thêm người vô hạn làm cả hệ thống ngừng phục vụ; giới hạn lượt phục vụ và thông báo quá tải giúp ổn định.", "scenario": "Payment API chậm 20s, checkout chỉ cho 5s: retry ba lần 5s trong request là sai budget. Có thể chuyển sang trạng thái Pending và đối soát bất đồng bộ.", "common_mistake": "Retry 500 vô hạn; retry POST không idempotency; đặt timeout bằng nhau trên mọi tầng nhưng không tính overhead.", "tradeoff": "Retry tăng khả năng thành công với transient faults nhưng có thể khuếch đại tải khi hệ thống đang quá tải.", "code": "// Pseudo policy\nTimeout: 2s/request\nRetry: max 2, exponential backoff + jitter\nCircuit: open after sustained failures\nBulkhead: concurrent calls <= safe limit", "practice": "Tạo fault injection 30% timeout từ mock provider; so sánh retry có/không có giới hạn và đồ thị số request downstream.", "quiz": {"question": "Tại sao retry không giới hạn là nguy hiểm?", "options": ["Vì HTTP không hỗ trợ retry", "Có thể khuếch đại overload và tạo duplicate", "Vì CPU luôn giảm", "Vì cache tự mất"], "correct": 1, "explain": "Retry cần budget, backoff và phải cân nhắc tác dụng phụ của operation."}, "reference": ""}, {"id": "w06-l4", "week": 6, "title": "Database Ownership, Outbox & Schema Migration", "concept": "Module integration", "essence": "Module hoặc service nên làm chủ dữ liệu và invariants của mình. Ghi chéo bảng gây coupling và làm database refactor khó. Outbox giải quyết bài toán commit DB xong nhưng publish event thất bại.", "mechanism": "Ghi Order và OutboxMessage trong cùng transaction DB, worker publish các message chưa gửi; consumer xử lý idempotent. Migration phải có khả năng expand/contract khi version cũ và mới cùng chạy.", "analogy": "Phiếu gửi hàng được ghi cùng hóa đơn, sau đó nhân viên chuyển hàng ra bưu điện; mất kết nối vẫn còn phiếu để giao sau.", "scenario": "Order committed nhưng Kafka down: outbox còn message để gửi khi hồi phục. Event có thể duplicate nên phía Kitchen vẫn phải deduplicate.", "common_mistake": "Ghi DB xong gọi Kafka trực tiếp, nếu fail thì cố rollback DB đã commit; tách module nhưng vẫn shared-write mọi table.", "tradeoff": "Outbox tăng bảng/worker và vận hành nhưng giảm nguy cơ mất event; không tự tạo exactly-once end-to-end.", "code": "BEGIN;\nINSERT INTO orders (...);\nINSERT INTO outbox (id, event_type, payload) VALUES (...);\nCOMMIT;\n-- Worker publish outbox với retry.", "practice": "Mô tả crash matrix 4 thời điểm: trước commit, sau commit, sau publish, trước ack; kết quả của outbox và consumer.", "quiz": {"question": "Outbox bảo đảm tốt nhất điều gì?", "options": ["Không bao giờ có duplicate", "Business write và ghi intent publish cùng transaction", "Kafka luôn online", "Không cần worker"], "correct": 1, "explain": "Outbox giữ trạng thái cần publish cùng transaction nghiệp vụ, worker thực hiện publish sau."}, "reference": ""}, {"id": "w07-l1", "week": 7, "title": "Docker: Image, Container, Layers và Build Context", "concept": "Containers", "essence": "Image là mẫu bất biến gồm metadata và filesystem layers; container là instance chạy từ image với writable layer và isolation. Dockerfile là hướng dẫn build; build context là tập file builder có thể nhìn thấy.", "mechanism": "Đi từ source → build context → Dockerfile instructions → image layers → registry → pull/run container. Volume dành cho dữ liệu cần bền; container filesystem không phải nơi giữ dữ liệu duy nhất.", "analogy": "Image giống bản thiết kế/đóng gói món ăn; container là từng suất đang được phục vụ theo gói đó.", "scenario": "Docker build -f src/Api/Dockerfile . dùng context ở repo root; COPY bị fail nếu path ngoài context. .dockerignore tránh gửi node_modules/secrets.", "common_mistake": "Nhầm Dockerfile là image; tin xóa container không mất dữ liệu lưu bên trong khi chưa dùng volume.", "tradeoff": "Multi-stage image nhỏ và an toàn hơn nhưng cấu hình build phức tạp; compose hữu ích local/staging nhưng không tự động là giải pháp orchestration production.", "code": "docker build -f src/Api/Dockerfile -t comhub-api:dev .\ndocker run --rm -p 8080:8080 comhub-api:dev\n# Dấu chấm cuối docker build là build context.", "practice": "Vẽ 5 bước source→image→registry→container; viết Dockerfile multi-stage cho .NET Web API và đo kích thước image.", "quiz": {"question": "Trong docker build -t app . ký tự dấu chấm là gì?", "options": ["Tên image", "Build context hiện tại", "Tên container", "Tùy chọn force"], "correct": 1, "explain": "Build context chứa các file mà builder có thể truy cập theo chỉ dẫn COPY/ADD."}, "reference": "https://docs.docker.com/build/concepts/context/"}, {"id": "w07-l2", "week": 7, "title": "CI/CD: Pipeline, Artifact, Environment & Rollback", "concept": "Delivery", "essence": "CI kiểm chứng tích hợp code sớm; CD đưa artifact đã kiểm thử qua các môi trường theo quy trình kiểm soát. Build một lần, promote cùng artifact giúp giảm khác biệt môi trường.", "mechanism": "Pipeline hợp lý gồm restore/build → unit/integration tests → security checks → package image → staging smoke tests → approval/deploy → health check → rollback. Secrets không đưa vào image/log.", "analogy": "Dây chuyền kiểm định: sản phẩm qua nhiều cổng, nhãn lô cho phép biết chính xác thứ gì được xuất xưởng.", "scenario": "Jenkins build .NET API, Docker image tag commit SHA rồi deploy staging, prod theo tag cố định. Nếu lỗi, rollback về image trước, cân nhắc DB schema migration tương thích.", "common_mistake": "Build lại từ branch khi deploy prod làm artifact không đúng thứ đã test; `latest` không truy xuất được provenance rõ.", "tradeoff": "Gate quá chặt làm giảm tốc độ; không có gate thì bug trôi sang prod. Ưu tiên kiểm soát rủi ro thay vì chỉ nhiều bước.", "code": "pipeline {\n  stages {\n    stage(\"Test\") { steps { sh \"dotnet test\" } }\n    stage(\"Build Image\") { steps { sh \"docker build -t app:$GIT_COMMIT .\" } }\n  }\n}", "practice": "Thiết kế 7 bước Jenkins pipeline cho ComHub; phân biệt bước nào cần fail-fast, approval và rollback.", "quiz": {"question": "Vì sao nên deploy cùng artifact đã được test?", "options": ["Giúp đổi màu UI", "Giảm khác biệt giữa phiên bản kiểm thử và phiên bản phát hành", "Vì Docker bắt buộc", "Không cần version"], "correct": 1, "explain": "Immutable artifact cho phép truy vết, tái lập và rollback đáng tin cậy."}, "reference": ""}, {"id": "w07-l3", "week": 7, "title": "Testing Pyramid, Contract Testing & TDD", "concept": "Test strategy", "essence": "Test là bằng chứng có giới hạn về hành vi, không phải tỉ lệ coverage càng cao càng tốt. Tầng test khác nhau bảo vệ những loại rủi ro khác nhau.", "mechanism": "Unit tests nhanh cho domain logic; integration kiểm tra DB/infra thật; contract tests đảm bảo giao tiếp; E2E bảo vệ user journey. Dùng TDD khi giúp rõ hành vi; không phải mọi mã cần mock.", "analogy": "Thuốc được kiểm tra từ thành phần đến cả quy trình; chỉ test chai thuốc không chứng minh dây chuyền vận hành đúng.", "scenario": "PlaceOrder có domain test về tổng tiền, integration test chống oversell PostgreSQL, contract test response, E2E checkout với UI.", "common_mistake": "Mock EF Core đến mức test không bao giờ chạy SQL thật; chỉ kiểm tra happy path; bỏ test lỗi và concurrency.", "tradeoff": "E2E đem niềm tin qua nhiều tầng nhưng chậm/dễ flaky; unit nhanh nhưng không phát hiện lỗi cấu hình DB/HTTP.", "code": "[Fact]\npublic void CannotPayDraftOrder() {\n  var order = Order.CreateDraft();\n  Assert.Throws<DomainException>(() => order.MarkPaid());\n}", "practice": "Lập test matrix cho 1 feature: 4 unit tests, 3 integration tests, 2 contract tests, 1 E2E, 2 failure tests.", "quiz": {"question": "Test nào chứng minh unique DB constraint hoạt động?", "options": ["Chỉ unit test mock repository", "Integration test với DB thật", "Snapshot ảnh UI", "Test compile"], "correct": 1, "explain": "Constraint thực thi ở database nên integration test DB thật mới tạo bằng chứng sát thực tế."}, "reference": ""}, {"id": "w07-l4", "week": 7, "title": "Security: Threat Modeling, AuthN/AuthZ, Secrets", "concept": "Security engineering", "essence": "Security là thuộc tính thiết kế xuyên hệ thống. Authentication xác định ai; authorization quyết định họ được làm gì trên tài nguyên cụ thể. Dữ liệu và secrets phải được bảo vệ theo nguyên tắc least privilege.", "mechanism": "Threat model theo tài sản, actor, trust boundary, entry point, abuse cases. Kiểm tra tenant isolation, IDOR/BOLA, injection, credential handling, file upload, audit và rate limit.", "analogy": "Biết danh tính khách không có nghĩa khách được mở mọi phòng của khách sạn.", "scenario": "GET /orders/{id} phải kiểm tra order thuộc tenant và user có quyền xem; không chỉ `[Authorize]` token hợp lệ.", "common_mistake": "Có JWT rồi kết luận API đã bảo mật; lấy tenantId do client gửi làm nguồn sự thật; log token/PII trong production.", "tradeoff": "Kiểm soát quyền chặt tăng nỗ lực phát triển và audit nhưng giảm tác động của lỗi hoặc tài khoản bị xâm nhập.", "code": "var order = await repo.GetById(id);\nif (order.TenantId != currentUser.TenantId)\n    throw new ForbiddenException();", "practice": "Vẽ trust boundary của ComHub và viết 10 abuse cases: cross-tenant, permission escalation, file upload, replay, secrets.", "quiz": {"question": "JWT hợp lệ có đủ để đọc bất kỳ OrderId?", "options": ["Có", "Không, phải kiểm tra resource authorization", "Có nếu là GET", "Chỉ với HTTP/2"], "correct": 1, "explain": "Identity hợp lệ không có nghĩa có quyền với tất cả tài nguyên."}, "reference": ""}, {"id": "w08-l1", "week": 8, "title": "Observability: Logs, Metrics, Traces", "concept": "Observability", "essence": "Logs ghi sự kiện; metrics đo trạng thái tổng hợp; traces theo dõi request qua nhiều span. Observability giúp đặt câu hỏi mới mà không cần deploy thêm log cho mọi tình huống.", "mechanism": "Gắn traceId/correlationId với logs, thu server latency, dependency latency, request rate, error rate, saturation. Các signal khác nhau bổ sung nhau; không có một metric thay thế tất cả.", "analogy": "Đồng hồ nhiệt cho biết máy đang nóng; nhật ký ghi biến cố; camera chuỗi công đoạn cho biết nóng bắt đầu ở đâu.", "scenario": "Order API 5s: trace cho thấy 4.6s ở SQL; query plan chỉ ra sort spill. Tối ưu SQL thay vì thêm server application.", "common_mistake": "Log toàn bộ object bao gồm token/PII, dashboard chỉ có CPU, nhầm lẫn logging nhiều với observability tốt.", "tradeoff": "Tracing có overhead và chi phí lưu trữ; sampling cần dựa vào các đường lỗi/latency quan trọng.", "code": "using var activity = activitySource.StartActivity(\"PlaceOrder\");\nactivity?.SetTag(\"tenant.id\", tenantId);\n// Không đặt thông tin nhạy cảm vào tags.", "practice": "Định nghĩa 8 metrics và 3 spans để phân tích đường PlaceOrder; mô tả cách truy một request lỗi.", "quiz": {"question": "Công cụ nào cho thấy request đi qua nhiều service/span?", "options": ["Distributed tracing", "Chỉ SQL schema", "Dockerfile", "Git tag"], "correct": 0, "explain": "Trace liên kết các span cùng một đường request hoặc workflow."}, "reference": ""}, {"id": "w08-l2", "week": 8, "title": "SLI, SLO, SLA và Error Budget", "concept": "Reliability", "essence": "SLI là chỉ số dịch vụ quan sát được; SLO là mục tiêu nội bộ; SLA là cam kết có thể mang tính hợp đồng. Không thể nói “hệ thống ổn định” nếu chưa chỉ ra điều người dùng quan tâm.", "mechanism": "Định nghĩa SLI theo user journey như request thành công và latency p95; SLO ví dụ 99,9% thành công trong rolling 30 ngày; error budget = phần rủi ro được chấp nhận theo mục tiêu.", "analogy": "Tiệm giao cơm cam kết 95/100 đơn đến đúng giờ; phải đo thực tế chứ không chỉ đo số tài xế đi làm.", "scenario": "API Order có SLO 99.9% successful requests trên 30 ngày, latency p95 dưới target trong điều kiện tải đã thống nhất; dùng burn-rate alert.", "common_mistake": "Chỉ theo dõi uptime máy chủ; đánh đồng SLA với SLO; đặt 100% cho mọi hệ thống mà không xét chi phí.", "tradeoff": "SLO cao tăng reliability yêu cầu nhưng chi phí vận hành/capacity có thể tăng mạnh; mục tiêu dựa tác động lên người dùng.", "code": "// Ví dụ: 100.000 request/tháng\n// SLO success 99.9% => budget lỗi ~100 request\n// Chỉ là minh họa, còn tùy định nghĩa eligible requests.", "practice": "Đề xuất 2 SLIs, 2 SLOs và cảnh báo burn rate cho checkout; nói rõ vì sao không chỉ đo CPU.", "quiz": {"question": "SLO là gì?", "options": ["Mục tiêu độ tin cậy được đặt cho SLI", "Một ngôn ngữ lập trình", "Tên một máy chủ", "Mọi thông báo log"], "correct": 0, "explain": "SLO là ngưỡng mục tiêu cho mức dịch vụ được đo bằng SLI."}, "reference": ""}, {"id": "w08-l3", "week": 8, "title": "Performance: Bottlenecks, Load Test & Capacity", "concept": "Performance engineering", "essence": "Latency, throughput, concurrency và saturation liên quan nhưng không đồng nghĩa. Tối ưu phải tìm điểm nghẽn lớn nhất và đo dưới tải phù hợp.", "mechanism": "Thiết lập baseline, workload thực, p50/p95/p99 latency, throughput, CPU, heap, DB waits, pool saturation. Khi arrival rate vượt service capacity, queue có thể tăng nhanh làm latency bùng nổ.", "analogy": "Đường chỉ có một trạm thu phí; thêm người lái không khiến trạm xử lý nhiều xe hơn.", "scenario": "1000 request cùng lúc; API CPU 15%, DB max connections: nút nghẽn ở pool/DB chứ không phải số pod API.", "common_mistake": "Tối ưu câu LINQ nhỏ trong khi query SQL chiếm 98% thời gian; load test mà không có realistic think time và test data.", "tradeoff": "Caching/batching tăng throughput một đường nhưng thêm staleness/memory; read replicas giảm read load nhưng tăng replication lag.", "code": "// Quan sát cùng lúc\n// RPS, p95 latency, 5xx, db.waits, pool.active, cpu%, gc.pause\n// Không kết luận chỉ từ một biểu đồ.", "practice": "Dùng k6/JMeter thử 50, 100, 200 virtual users; lập bảng bottleneck dựa vào đo CPU, DB, pool, p95.", "quiz": {"question": "CPU thấp và latency cao chứng minh điều gì?", "options": ["Code luôn nhanh", "Có thể đang chờ I/O hoặc contention, cần điều tra", "Cần tăng CPU ngay", "Không cần tracing"], "correct": 1, "explain": "Độ trễ có thể đến từ thời gian chờ ngoài CPU; cần đo từng dependency."}, "reference": ""}, {"id": "w08-l4", "week": 8, "title": "Incident Response, Rollback & Failure Drills", "concept": "Production operations", "essence": "Hệ thống mạnh không phải hệ thống không bao giờ lỗi, mà là phát hiện, giới hạn ảnh hưởng, phục hồi và học từ sự cố. Incident review tập trung vào cơ chế và điều kiện gây lỗi.", "mechanism": "Chuẩn bị runbook, alert routing, rollback, feature flag, backup/restore verification, blameless retrospective. Diễn tập dependency down, DB full, connection saturation trong môi trường an toàn.", "analogy": "Phòng cháy hiệu quả gồm báo động, lối thoát, diễn tập và phân tích nguyên nhân chứ không chỉ hy vọng không cháy.", "scenario": "Worker Kafka retry storm tăng tải PostgreSQL; tạm ngừng consumer, giảm retry, kiểm tra DLQ và backlog, phục hồi từng bước.", "common_mistake": "Đợi sự cố thật mới thử restore database; rollout không canary, không health checks, không đo rollback time.", "tradeoff": "Canary/blue-green giảm blast radius nhưng đòi hỏi cơ chế đo health và tương thích schema giữa phiên bản.", "code": "# Runbook ngắn\n# Detect: alert nào?\n# Contain: tắt feature/scale consumer?\n# Restore: rollback procedure?\n# Verify: SLI, logs, business invariants?", "practice": "Viết tabletop drill: database hết connection khi sale giờ trưa; timeline 15 phút đầu và runbook phục hồi.", "quiz": {"question": "Mục tiêu quan trọng nhất sau khi khắc phục incident?", "options": ["Tìm người để trách", "Hiểu cơ chế và phòng ngừa tái diễn", "Xóa toàn bộ log", "Ngừng deploy vĩnh viễn"], "correct": 1, "explain": "Postmortem hữu ích biến lỗi vận hành thành cải tiến hệ thống và quy trình."}, "reference": ""}, {"id": "w09-l1", "week": 9, "title": "LLM Fundamentals: Tokens, Context, Hallucination", "concept": "LLM foundations", "essence": "LLM dự đoán/generate chuỗi token theo ngữ cảnh và dữ liệu đã học, không phải nguồn sự thật có truy vấn live mặc định. Đầu ra có thể mạch lạc nhưng sai; xác suất và wording có thể làm câu trả lời biến đổi.", "mechanism": "Tách knowledge, context, tools, instructions, inference cost/latency. Context window có giới hạn; nhiều tokens không đồng nghĩa chất lượng cao. Với task cần chính xác phải có nguồn, tests và acceptance criteria.", "analogy": "Người làm bài thi viết rất trôi chảy chưa chắc đã tra đúng hồ sơ thực tế của công ty.", "scenario": "Hỏi AI thiết kế idempotent endpoint: chỉ đưa stack .NET thì AI có thể bịa tên bảng; cần cung cấp schema thật và constraint.", "common_mistake": "Coi AI như compiler deterministic; copy SQL migration chưa kiểm tra; tin model nhớ mã nguồn chưa cấp cho nó.", "tradeoff": "Model lớn có thể giải reasoning khó nhưng chậm/đắt hơn; dùng model và context theo độ khó, luôn có quality gate.", "code": "// Một yêu cầu có kiểm chứng\nGoal: API PlaceOrder không duplicate\nConstraints: .NET + PostgreSQL\nEvidence: integration tests + explain concurrency\nDo not invent schema or claim tests passed.", "practice": "Cho hai AI prompts cùng bài toán: một mơ hồ, một có invariant/schema/test. Chấm đầu ra theo rubric 5 tiêu chí.", "quiz": {"question": "Đầu ra LLM viết mạch lạc có bảo đảm đúng không?", "options": ["Có", "Không, cần xác minh bằng nguồn/test", "Có nếu dài", "Có nếu nhiều markdown"], "correct": 1, "explain": "Fluent text không chứng minh factual correctness hay code behavior."}, "reference": ""}, {"id": "w09-l2", "week": 9, "title": "Prompt Engineering vs Context Engineering", "concept": "AI workflow", "essence": "Prompt là chỉ dẫn; context engineering là thiết kế đầy đủ thông tin đưa vào đúng thời điểm: goal, code, constraints, policies, historical decisions, tools và output format.", "mechanism": "Tạo repository guidance: README, architecture.md, ADR, module boundaries, test commands. Dùng retrieval/selection để tránh đưa cả repo bừa bãi; giữ các bằng chứng quan trọng gần task.", "analogy": "Giao việc cho đồng nghiệp: câu “làm giúp” khác giao bản thiết kế, điều kiện nghiệm thu và đường dẫn tài liệu.", "scenario": "Codex refactor Orders: cần schema, CI status, API contracts, constraints no cross-module DB writes; yêu cầu ghi rõ giả định trước khi sửa.", "common_mistake": "Viết prompt dài 10000 chữ nhưng không cung cấp source đúng; ràng buộc mâu thuẫn; context cũ không cập nhật.", "tradeoff": "Context nhiều tăng token và gây nhiễu; context ngắn có thể thiếu điều kiện. Chọn đúng thông tin và yêu cầu model nêu khoảng trống.", "code": "TASK: Make PlaceOrder idempotent\nREAD: /docs/architecture.md, /Modules/Orders\nCONSTRAINT: no DB cross-module access\nVERIFY: dotnet test + race integration test\nOUTPUT: diff, risks, tests, ADR if needed", "practice": "Tạo file AI_WORKFLOW.md quy định context loading, task contract, review checklist và quy tắc không tự merge khi test fail.", "quiz": {"question": "Khác biệt quan trọng của context engineering?", "options": ["Chọn model màu đẹp", "Đưa đúng bằng chứng và quy tắc vào luồng giải task", "Chỉ tăng độ dài prompt", "Luôn gửi toàn bộ repo"], "correct": 1, "explain": "Context engineering tối ưu nội dung, thời điểm và tính đáng tin cậy của dữ liệu mà AI sử dụng."}, "reference": ""}, {"id": "w09-l3", "week": 9, "title": "AI Agents, Tools, Planning và Human Approval", "concept": "Agent systems", "essence": "Agent kết hợp model và vòng lặp quan sát–quyết định–gọi công cụ–nhận kết quả. Khác một prompt đơn: agent có thể thực hiện nhiều bước và tác động đến hệ thống thực.", "mechanism": "Chia quyền read vs write, xác định tool schemas, giới hạn số bước, budget, checkpoint, approval cho tác động lớn, logs/traces, fallback khi tool lỗi.", "analogy": "Nhân viên mới có checklist và chìa khóa kho: việc có khả năng mở kho không đồng nghĩa nên được quyền mở mọi kho.", "scenario": "Agent QA đọc backlog, tạo test, chạy CI; nếu cần thay migration production hoặc merge vào main phải qua review/approval theo chính sách.", "common_mistake": "Cấp quyền DB production write cho agent chỉ để “cho tiện”; cho tool output từ web được phép ghi đè system rules.", "tradeoff": "Tự động hóa tăng throughput nhưng tăng blast radius khi model/tool sai; human-in-the-loop nên đặt đúng điểm rủi ro.", "code": "// Agent loop pseudo\nwhile (steps++ < 8) {\n const plan = await model.decide(context);\n const result = await allowedTool(plan);\n context.add(result);\n}\n// Writes may require approval.", "practice": "Vẽ một agent quy trình review PR với 4 tools, quyền được phép, failure handling và bước human approval.", "quiz": {"question": "Cách cấp quyền an toàn nhất cho agent?", "options": ["Cho toàn quyền ngay", "Least privilege + approval với tác động cao", "Ẩn mọi log", "Chỉ dùng một prompt dài"], "correct": 1, "explain": "Quyền tối thiểu và ranh giới phê duyệt giới hạn hậu quả của quyết định sai."}, "reference": "https://developers.openai.com/api/docs/guides/agents/sdk"}, {"id": "w09-l4", "week": 9, "title": "MCP: Tích hợp công cụ, quyền hạn và Trust Boundaries", "concept": "MCP & integrations", "essence": "MCP chuẩn hóa cách ứng dụng AI khám phá và gọi tools/resources qua một giao thức, không tự bảo đảm an toàn, đúng dữ liệu hay authorization. Server/tool vẫn là phần mềm phải được đánh giá tin cậy.", "mechanism": "Hiểu client, server, tool description/schema, invocation, permissions và boundary giữa instruction từ người dùng với nội dung không đáng tin từ tool result. Chặn prompt injection từ dữ liệu ngoài.", "analogy": "Một ổ cắm chuẩn giúp cắm thiết bị khác nhau nhưng không chứng minh thiết bị đó an toàn.", "scenario": "Agent đọc GitHub issues qua MCP, chạy grep, đề xuất PR; tool ghi trực tiếp production DB không nên được cấp mặc định.", "common_mistake": "Tin tất cả tool descriptions, cho server không rõ nguồn đọc secrets, không audit hành động.", "tradeoff": "MCP giảm chi phí tích hợp nhưng tăng surface area bảo mật; nên whitelist tools và audit từng connector.", "code": "// Quyền đề xuất\ngithub.read: allow\ngithub.create_pr: approval\nprod_db.read: restricted\nprod_db.write: deny by default", "practice": "Lập bảng phân quyền cho MCP GitHub, TFS, filesystem, SQL và browser; nêu 3 prompt injection attacks cần phòng.", "quiz": {"question": "MCP giúp chuẩn hóa điều gì?", "options": ["Bảo đảm mọi câu trả lời AI đúng", "Kết nối và dùng tools/resources theo giao thức chung", "Tự chạy Docker", "Loại bỏ authentication"], "correct": 1, "explain": "MCP là interoperability layer; trust/authorization vẫn phải thiết kế riêng."}, "reference": ""}, {"id": "w10-l1", "week": 10, "title": "RAG, Embeddings, Chunking & Retrieval", "concept": "RAG", "essence": "RAG đưa thông tin liên quan từ nguồn ngoài vào context trước khi model tạo trả lời. Embedding biểu diễn văn bản thành vector cho semantic search; vector similarity không thay thế lọc quyền truy cập và kiểm chứng nguồn.", "mechanism": "Pipeline: ingest → clean → chunk → index → retrieve/hybrid search → rerank → generate có citation → eval. Quyền tenant/user cần filter từ retrieval, không chỉ yêu cầu model “đừng lộ”.", "analogy": "Trước khi trả lời câu hỏi về nội quy, nhân viên tra đúng trang sổ tay thay vì cố nhớ nguyên cuốn.", "scenario": "AI tra policy nội bộ: query phải lọc theo tenantId/ACL trước khi trả documents, tránh trả tài liệu tài chính của doanh nghiệp khác.", "common_mistake": "Cho toàn bộ PDF lớn vào prompt rồi hy vọng model tìm đúng; dùng embeddings mà không đo recall/precision; index dữ liệu nhạy cảm chung không ACL.", "tradeoff": "Chunk nhỏ tăng precision nhưng mất context; chunk lớn giữ ngữ cảnh nhưng tốn tokens/nhiễu. Hybrid search cải thiện trường hợp mã định danh chính xác.", "code": "// Retrieval pseudo\ndocs = vectorSearch(query, filter: { tenantId, acl });\nanswer = llm(question, context: docs);\n// Gắn citation đúng đoạn và hiển thị uncertainty.", "practice": "Lập thiết kế RAG cho tài liệu vận hành HRM: 3 loại tài liệu, ACL, chunk strategy và 10 câu hỏi đánh giá.", "quiz": {"question": "RAG đảm bảo chống lộ tài liệu tenant bằng cách nào?", "options": ["Chỉ nhắc model giữ bí mật", "Áp ACL tại retrieval và các tầng kiểm soát liên quan", "Tăng temperature", "Gửi mọi file cho model"], "correct": 1, "explain": "Retrieval phải loại tài liệu không được phép trước khi đưa vào context."}, "reference": ""}, {"id": "w10-l2", "week": 10, "title": "Evals: Làm sao đo chất lượng hệ thống AI?", "concept": "AI evaluations", "essence": "Evaluation biến cảm nhận “AI có vẻ tốt” thành tiêu chí có thể đo và tái hiện. Đo tác vụ thực, phân nhóm lỗi, có golden examples và human review khi tiêu chí khó tự động hóa.", "mechanism": "Tạo eval dataset gồm normal/edge/adversarial cases, rubric factuality, correctness, tool permission, latency, cost. Theo dõi regression qua phiên bản prompt/model/tools; không chỉ dùng một số điểm trung bình.", "analogy": "Kiểm tra học sinh không thể chỉ hỏi lại một câu từng thấy rồi kết luận đã hiểu cả chương.", "scenario": "AI tạo SQL từ câu hỏi: 30 case, đo query đúng schema, không lộ dữ liệu tenant, read-only, kết quả chính xác và chi phí.", "common_mistake": "Dùng AI chấm AI không có bộ đối chiếu; test 3 ví dụ dễ rồi deploy; thay prompt không chạy regression.", "tradeoff": "Automatic eval nhanh và rẻ nhưng có false positives/negatives; human review chính xác hơn với tình huống phức tạp nhưng tốn công.", "code": "// Mini rubric\ncorrectness: 0..3\ngroundedness: 0..3\nsecurity: pass/fail\ntool_policy: pass/fail\nlatency_ms: number", "practice": "Lập 20 eval cases cho agent review PR: 5 normal, 5 edge, 5 failure, 5 security. Định nghĩa pass gate.", "quiz": {"question": "Eval dataset tốt cần gì?", "options": ["Toàn bộ case dễ", "Case đại diện gồm edge và failure với expected behavior", "Chỉ đánh giá tốc độ", "Chỉ một ví dụ thành công"], "correct": 1, "explain": "Bộ đánh giá cần phản ánh hành vi mục tiêu và rủi ro thực của ứng dụng."}, "reference": ""}, {"id": "w10-l3", "week": 10, "title": "AI Code Review: từ AI-generated đến Verified Code", "concept": "AI-assisted development", "essence": "AI có thể đề xuất code nhanh, nhưng người kỹ sư sở hữu yêu cầu, invariant, security, data migrations và hành vi production. “Build xanh” chỉ là một tín hiệu, chưa phải định nghĩa done.", "mechanism": "Workflow: task contract → AI plan → implement nhỏ → static checks → unit/integration tests → diff review → threat/perf review → preview → merge policy. Tránh thay đổi quá lớn không thể review.", "analogy": "Bản nháp hợp đồng do trợ lý soạn cần người ký kiểm tra điều khoản; code do AI sinh cũng cần bằng chứng.", "scenario": "AI tạo handler xử lý duplicate, nhưng test chỉ mock repo và không thấy race giữa hai pods. Thêm integration test đồng thời với DB thật.", "common_mistake": "Duyệt PR vì “AI nói đã test”; cho AI sửa thêm file ngoài scope; không kiểm tra migration và permissions.", "tradeoff": "Tự động hóa tạo nhiều code tiết kiệm thời gian gõ nhưng review/maintenance vẫn có chi phí; tối ưu khối lượng thay đổi có thể kiểm soát.", "code": "PR CHECKLIST:\n[ ] Domain invariant\n[ ] Concurrent + retry tests\n[ ] AuthZ / tenant checks\n[ ] Migration safety\n[ ] Metrics + rollback\n[ ] Diff scope explained", "practice": "Chọn một PR gần đây (hoặc giả định), review theo 6 hạng mục; chỉ chấp nhận khi có evidence cụ thể.", "quiz": {"question": "Ai chịu trách nhiệm khi AI tạo code gây lỗi?", "options": ["Chỉ AI vendor", "Người/nhóm phê duyệt và vận hành phần mềm", "Không ai", "Chỉ QA"], "correct": 1, "explain": "Đội kỹ thuật phải áp dụng quy trình kiểm chứng và chịu trách nhiệm về phần mềm đưa vào sử dụng."}, "reference": ""}, {"id": "w10-l4", "week": 10, "title": "Thiết kế AI Feature an toàn, có giám sát", "concept": "AI product design", "essence": "Tích hợp LLM thành feature cần xử lý độ bất định, rủi ro dữ liệu, chi phí token, quan sát và trải nghiệm khi không chắc chắn. Đừng nhầm demo trả lời tốt với sản phẩm production.", "mechanism": "Định nghĩa use case, permissions, data boundary, fallback, rate limit, prompt/versioning, eval, logging không nhạy cảm, kill switch, human approval cho high-impact actions.", "analogy": "Nhân viên hỗ trợ tự động cần biết khi nào nói “không chắc” và chuyển người thật, không tự cấp quyền sửa dữ liệu.", "scenario": "AI gợi ý phân loại phản hồi khách hàng ComHub: cho phép đề xuất tag, không tự hủy đơn/hoàn tiền nếu chưa xác nhận.", "common_mistake": "Tích hợp chatbot đọc tất cả dữ liệu doanh nghiệp rồi cho phép thao tác DB; không đo hallucination và cost.", "tradeoff": "Tự động hóa càng sâu càng tiết kiệm công nhưng tăng chi phí kiểm soát, audit và xử lý lỗi.", "code": "AI_OUTPUT = { suggestion, evidenceIds, confidenceNote };\n// Action write được thực thi qua business API có auth/validation.\n// Không chạy SQL do model tạo trực tiếp trên prod.", "practice": "Thiết kế một feature AI “tóm tắt đơn khiếu nại”, nêu 5 failure modes, guardrails và bộ eval tối thiểu.", "quiz": {"question": "Khi AI không chắc chắn và action ảnh hưởng dữ liệu khách hàng?", "options": ["Tự thao tác", "Yêu cầu xác nhận hoặc chuyển kiểm duyệt phù hợp", "Tăng temperature", "Tắt log vĩnh viễn"], "correct": 1, "explain": "High-impact writes cần chính sách quyền và approval phù hợp, nhất là khi model không chắc chắn."}, "reference": ""}, {"id": "w11-l1", "week": 11, "title": "Architecture Decision Records: quyết định có căn cứ", "concept": "ADR", "essence": "Kiến trúc là tập các quyết định quan trọng với bối cảnh và hậu quả, không chỉ sơ đồ boxes/arrows. ADR giúp người đến sau hiểu tại sao đội chọn giải pháp tại thời điểm đó.", "mechanism": "Mỗi ADR nêu context, problem, constraints, options, tradeoff table, decision, consequences, revisit trigger. Bằng chứng gồm measurement, cost, team capability và expected change.", "analogy": "Nhật ký hành trình ghi vì sao chọn con đường A khi cầu B đóng; người đi sau không phải đoán.", "scenario": "ComHub chọn Modular Monolith thay microservices vì team nhỏ, domain chưa ổn định, deploy đơn giản; điều kiện xem lại là module scale khác biệt rõ.", "common_mistake": "Viết ADR chỉ có “chọn Kafka vì scalable”; không nêu alternatives hoặc hệ quả vận hành.", "tradeoff": "ADR tăng công ghi chép nhưng giảm chi phí tranh luận lại; ADR ngắn, gắn với quyết định thực sự quan trọng.", "code": "# ADR-007: Modular Monolith\nContext: team 3 người, MVP 6 tháng\nOptions: monolith / modular / microservices\nDecision: modular monolith\nConsequences: simpler deploy; need module isolation tests", "practice": "Viết ADR chọn PostgreSQL vs SQL Server cho ComHub: 5 criteria, lựa chọn, hậu quả, trigger xét lại.", "quiz": {"question": "ADR tốt nhất cần nội dung nào?", "options": ["Chỉ quyết định", "Context, alternatives, rationale và consequences", "Chỉ sơ đồ UML", "Chỉ tên tác giả"], "correct": 1, "explain": "ADR có giá trị vì lưu lý do và đánh đổi thay vì chỉ ghi quyết định cuối."}, "reference": ""}, {"id": "w11-l2", "week": 11, "title": "Trade-offs: Reliability, Performance, Cost & Team", "concept": "Systems judgment", "essence": "Một giải pháp có thể tăng performance nhưng tăng complexity, cloud bill hoặc risk. Quyết định đúng tối ưu trong ràng buộc thực, không tối ưu từng metric độc lập.", "mechanism": "Dùng quality attributes: reliability, security, performance, cost, operability, evolvability; xác định constraints và thứ tự ưu tiên. Ước lượng tổng chi phí xây-vận hành-đổi thay.", "analogy": "Xe đua nhanh hơn xe tải, nhưng không phải lựa chọn tốt để giao 5 tấn hàng.", "scenario": "Dùng Kafka cho một workflow ít sự kiện có thể tăng vận hành hơn lợi ích; background jobs/DB queue đủ cho giai đoạn đầu.", "common_mistake": "Dùng từ “best practice” mà không nêu ngữ cảnh; tối ưu throughput bằng cách chấp nhận mất đơn mà stakeholder không đồng ý.", "tradeoff": "Có lựa chọn phù hợp giai đoạn MVP nhưng cần trigger thay đổi khi scale/team/risk thay đổi; tránh thiết kế bất biến.", "code": "// Decision matrix (minh họa)\nOption A: +simplicity, +ops ease, -independent scale\nOption B: +independent scale, -ops complexity\n// Cần weight dựa vào yêu cầu thực.", "practice": "Đề xuất 3 giải pháp xử lý notifications: synchronous call, Hangfire job, Kafka event. Chấm rủi ro/chi phí và chọn theo quy mô giả định.", "quiz": {"question": "Điều gì quyết định một công nghệ là phù hợp?", "options": ["Độ mới", "Fit với constraints và quality attributes cần ưu tiên", "Số sao GitHub duy nhất", "Nhiều lớp nhất"], "correct": 1, "explain": "Lựa chọn nên dựa vào bài toán, rủi ro và đánh đổi, không dựa vào danh tiếng công nghệ."}, "reference": ""}, {"id": "w11-l3", "week": 11, "title": "Product Thinking: Discovery, MVP & Scope Control", "concept": "Product mindset", "essence": "Kỹ sư làm ra giá trị cho người dùng, không chỉ delivery feature. MVP kiểm chứng giả định cốt lõi với phạm vi nhỏ có thể đo được; không có nghĩa code cẩu thả hoặc thiếu bảo mật.", "mechanism": "Tách problem hypothesis, user journey, must-have, metrics, assumptions, experiments, release slices. Ưu tiên những thứ giảm rủi ro bất định nhất thay vì xây nhiều tính năng phức tạp sớm.", "analogy": "Trước khi xây cả siêu thị, kiểm tra xem khách có mua sản phẩm chính tại quầy nhỏ hay không.", "scenario": "ComHub MVP ưu tiên chọn món, đặt theo nhóm, bếp nhận đơn, trạng thái, thanh toán cơ bản; no-code builder và AI có thể để giai đoạn sau nếu chưa chứng minh nhu cầu.", "common_mistake": "Xem MVP là làm 30% chất lượng; xây low-code ngay dù chưa hiểu quy trình người dùng; chỉ đo số tính năng đã xong.", "tradeoff": "MVP nhanh giảm time-to-learning nhưng cần sẵn modularity/security baseline để tránh rewrite toàn bộ.", "code": "MVP hypothesis: “Nhóm văn phòng có thể đặt và gom giao đơn trong 2 phút”\nMetric: conversion; order errors; completion time\nGuardrail: no duplicate payments.", "practice": "Viết một product hypothesis và 3 release slices cho tính năng group ordering, cùng metric thành công.", "quiz": {"question": "MVP có mục đích chính gì?", "options": ["Có thật nhiều tính năng", "Học và kiểm chứng giả định quan trọng với sản phẩm đủ dùng", "Bỏ mọi test", "Không cần khách hàng"], "correct": 1, "explain": "MVP là công cụ học có kiểm chứng bằng giá trị/hành vi thực của người dùng."}, "reference": ""}, {"id": "w11-l4", "week": 11, "title": "SA Lead: Technical Communication & Team Decisions", "concept": "Leadership", "essence": "Lead không chỉ là người có lời giải giỏi nhất. Họ biến bất định thành quyết định có căn cứ, xây năng lực của team và chịu trách nhiệm chất lượng tổng thể.", "mechanism": "Giao tiếp theo bối cảnh → options → risks → recommendation → decision needed. Review không áp đặt; nêu nguyên tắc, evidence và trao quyền với guardrails. Quản lý công việc bằng outcome thay vì số dòng code.", "analogy": "Nhạc trưởng không chơi mọi nhạc cụ nhưng cần biết phần nào lệch nhịp và phối hợp để cả dàn nhạc đúng bài.", "scenario": "CTO ép release trong 2 tuần: SA Lead đưa scope slices, capacity, dependencies, quality gates, top risks, phương án nếu bỏ tính năng X.", "common_mistake": "Hứa deadline trước khi đánh giá; giữ mọi quyết định kỹ thuật ở một người; sửa code hộ team thay vì hướng dẫn.", "tradeoff": "Quy trình chặt giảm sai sót nhưng quá nhiều approval gây bottleneck; chuẩn hóa quyết định thường xuyên, escalate trường hợp rủi ro cao.", "code": "Decision memo:\nGoal / Deadline / Capacity\nOptions A,B,C\nRisks + Impact\nRecommendation + Tradeoff\nApproval needed + Next checkpoint", "practice": "Viết thông điệp 200 từ gửi CTO giải thích việc lùi tính năng phụ để bảo đảm checkout core đạt SLO; có phương án thay thế.", "quiz": {"question": "Một SA Lead nên đo điều gì?", "options": ["Số commit cá nhân", "Outcome, reliability, khả năng delivery và sự trưởng thành của team", "Số lời chỉ trích", "Số interface"], "correct": 1, "explain": "Leadership hướng tới năng lực ra quyết định và vận hành bền vững của cả nhóm."}, "reference": ""}, {"id": "w12-l1", "week": 12, "title": "Capstone 1: Thiết kế Domain ComHub & Module Boundaries", "concept": "Capstone", "essence": "Dùng toàn bộ kiến thức để xây kiến trúc một nền tảng đặt cơm đa cửa hàng/đa tenant. Không bắt đầu với công nghệ; bắt đầu từ user journeys và invariants quan trọng nhất.", "mechanism": "Ghi actor, 10 use cases, 15 invariants, context map, database ownership, API contracts và non-functional requirements. Các module ứng viên: Identity, Catalog, Ordering, GroupOrder, Kitchen, Payment, Notification.", "analogy": "Bản thiết kế tốt là bản giúp người khác phản biện và triển khai được, không chỉ trông đẹp.", "scenario": "Group ordering nhiều người cùng giỏ có cut-off time; snapshot đơn/tổng tiền khi chốt; events cập nhật bếp sau commit thông qua outbox.", "common_mistake": "Cho mọi module ghi chung bảng và gọi là microservices; bỏ qua cách xử lý partial payment và đơn bị cancel sau cut-off.", "tradeoff": "Ít module dễ phối hợp nhưng trách nhiệm dễ chồng; nhiều module rõ ownership nhưng chi phí giao tiếp tăng. Tách theo invariants và change rate.", "code": "contexts: [Identity, Catalog, Ordering, Kitchen, Payments]\ncore-invariants: [NoOversell, NoDuplicateOrder, PriceSnapshot]\ncritical-flow: PlaceOrder -> Commit+Outbox -> Kitchen", "practice": "Nộp Architecture Pack gồm diagram, API contracts, invariant list, 3 ADR và threat model tối thiểu.", "quiz": {"question": "Thứ đầu tiên khi thiết kế ComHub nên xác định?", "options": ["Docker orchestrator", "Actors, use cases và invariants", "Tên dự án GitHub", "Số lượng microservices"], "correct": 1, "explain": "Bắt đầu từ hành vi cần đúng rồi mới chọn structure và platform."}, "reference": ""}, {"id": "w12-l2", "week": 12, "title": "Capstone 2: Architecture Review theo các quality attributes", "concept": "Architecture review", "essence": "Review kiến trúc là phương pháp tìm các rủi ro có thể xảy ra trước khi chúng thành incident. Không chỉ kiểm tra SOLID; phải soi user journey, data consistency, security, operation và cost.", "mechanism": "Dùng checklist: data ownership, authZ, failure/timeout, duplicate events, bottlenecks, observability, rollback, audit, GDPR-like data considerations phù hợp, team capacity. Phân loại severity và evidence.", "analogy": "Kiểm định cầu cần xem tải trọng, vật liệu, điều kiện thời tiết, kế hoạch bảo trì; chỉ xem bản vẽ đẹp chưa đủ.", "scenario": "Luồng PlaceOrder: nếu Kafka down, order vẫn được lưu? Nếu payment callback đến trước order-confirmed? Nếu tenant A đoán orderId tenant B?", "common_mistake": "Đánh giá bằng sở thích cá nhân, không có severity/risk owner; bỏ qua trường hợp hệ thống hỏng một phần.", "tradeoff": "Review càng sâu càng tốn thời gian; ưu tiên đường tiền/dữ liệu khách và nguy cơ irreversible.", "code": "Risk register:\nID | Scenario | Impact | Likelihood | Evidence\nR1 | Duplicate payment | High | Medium | Needs test\nR2 | Cross-tenant read | Critical | ? | AuthZ review", "practice": "Lập 20 review findings cho ComHub giả định, xếp severity, recommendation và verification steps; chọn top 5 cần xử lý trước release.", "quiz": {"question": "Finding tốt cần gì?", "options": ["Cảm giác “c
